<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almuerzos D'Eliz · Tablero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,800&display=swap" rel="stylesheet">
<script>
  /* Tema aplicado antes de pintar (por defecto: oscuro "ónix y oro") */
  (function(){var t=null;try{t=localStorage.getItem('deliz-tema')}catch(e){}
  document.documentElement.setAttribute('data-theme',t||'dark');})();
</script>
<style>
/* =========================================================
   TEMA — "Medianoche" (oscuro) / "Cielo" (claro)
   Series validadas (contraste + daltonismo):
   Ventas = Azul · Gastos = Coral · Utilidad = Turquesa
   ========================================================= */
:root{
  color-scheme: light;
  --bg:#eef3ff; --surface:rgba(255,255,255,.86); --surface-solid:#ffffff; --surface-2:#f1f5ff; --surface-3:#e2e9fb;
  --text:#0f172a; --text-2:#475569; --muted:#8391aa; --border:rgba(148,163,209,.28);
  --accent:#3b6cf6; --accent-soft:rgba(59,108,246,.10); --accent-ink:#2448c7;
  --c-ventas:#2f6bea; --c-gastos:#e0506a; --c-util:#0e9fb8; --c-neg:#d93b4f; --hi-ventas:#7c9cff;
  --good:#12805c; --good-bg:rgba(18,128,92,.12); --warn:#9a6300; --warn-bg:rgba(245,166,35,.16); --crit:#d23a4e; --crit-bg:rgba(210,58,78,.11);
  --shadow:0 2px 6px rgba(30,50,120,.05),0 12px 32px rgba(30,50,120,.08);
  --shadow-h:0 6px 14px rgba(47,107,234,.12),0 22px 50px rgba(47,107,234,.18);
  --radius:26px;
  --grad:linear-gradient(135deg,#3b82f6 0%,#6366f1 55%,#8b5cf6 100%);
  --grad-text:linear-gradient(90deg,#2f6bea,#7c3aed);
  --g-ventas:linear-gradient(135deg,#2563eb,#4f46e5 60%,#7c3aed);
  --g-gastos:linear-gradient(135deg,#f43f5e,#e0506a 50%,#fb7185);
  --g-util:linear-gradient(135deg,#0891b2,#0ea5a4 55%,#14b8a6);
  --g-margen:linear-gradient(135deg,#7c3aed,#9333ea 50%,#c026d3);
  --g-cobrar:linear-gradient(135deg,#f97316,#ef4444 60%,#e11d48);
  --blob1:rgba(99,102,241,.28); --blob2:rgba(56,189,248,.28); --blob3:rgba(244,114,182,.18);
  --side-bg:linear-gradient(180deg,#0a1024 0%,#0f1a3d 60%,#141b4a 100%); --side-text:#c3cbe6; --side-muted:#7482ad; --side-hover:rgba(255,255,255,.06); --side-border:rgba(255,255,255,.07);
  --font:Nunito,"Segoe UI Rounded","SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#070b18; --surface:rgba(20,27,52,.72); --surface-solid:#131a33; --surface-2:rgba(255,255,255,.045); --surface-3:rgba(255,255,255,.09);
  --text:#eef2ff; --text-2:#b3bddb; --muted:#7d89b0; --border:rgba(148,163,255,.12);
  --accent:#6f8dff; --accent-soft:rgba(111,141,255,.14); --accent-ink:#a9bbff;
  --c-ventas:#3f7bf2; --c-gastos:#e8627a; --c-util:#16a89a; --c-neg:#f0707f; --hi-ventas:#8ea8ff;
  --good:#4ade9a; --good-bg:rgba(74,222,154,.12); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13); --crit:#fb7185; --crit-bg:rgba(251,113,133,.13);
  --shadow:0 2px 8px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.25);
  --shadow-h:0 8px 20px rgba(63,123,242,.22),0 26px 60px rgba(0,0,0,.45);
  --grad-text:linear-gradient(90deg,#8ea8ff,#c4b5fd);
  --blob1:rgba(79,70,229,.34); --blob2:rgba(14,165,233,.22); --blob3:rgba(168,85,247,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;transition:background .4s,color .4s;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
::selection{background:rgba(99,102,241,.3)}

/* Fondo animado (auroras) */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:1;animation:flot 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--blob1)}
.aurora i:nth-child(2){width:40vw;height:40vw;right:-12vw;top:20vh;background:var(--blob2);animation-duration:28s;animation-delay:-6s}
.aurora i:nth-child(3){width:34vw;height:34vw;left:30vw;bottom:-16vw;background:var(--blob3);animation-duration:32s;animation-delay:-12s}
@keyframes flot{0%{transform:translate(0,0) scale(1)}33%{transform:translate(6vw,4vh) scale(1.08)}66%{transform:translate(-4vw,8vh) scale(.95)}100%{transform:translate(3vw,-5vh) scale(1.05)}}

/* Splash */
.splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#16215a,#060914 70%);transition:opacity .5s,visibility .5s}
.splash.off{opacity:0;visibility:hidden}
.splash .ring{position:relative;width:148px;height:148px;border-radius:50%;display:grid;place-items:center}
.splash .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#3b82f6,#8b5cf6,#22d3ee,#3b82f6);animation:spin 1.6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%)}
.splash img{width:132px;height:132px;border-radius:50%;animation:pulse 1.8s ease-in-out infinite}
.splash p{color:#b9c4ee;font-weight:700;letter-spacing:.06em;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
.side{position:sticky;top:0;height:100vh;background:var(--side-bg);padding:22px 16px;display:flex;flex-direction:column;gap:6px;color:var(--side-text);border-radius:0 30px 30px 0;box-shadow:8px 0 40px rgba(10,16,40,.25);z-index:5}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 6px 18px;margin-bottom:12px;border-bottom:1px solid var(--side-border)}
.logo-wrap{position:relative;width:104px;height:104px;border-radius:50%;margin-bottom:12px;animation:floaty 5s ease-in-out infinite;cursor:pointer}
.logo-wrap::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#3b82f6,#8b5cf6,#22d3ee,#3b82f6);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%)}
.logo-wrap::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.45),transparent 70%);z-index:-1;filter:blur(8px)}
.logo-wrap img{width:100%;height:100%;border-radius:50%;display:block;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.logo-wrap:hover img{transform:rotate(-8deg) scale(1.06)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.brand b{display:block;font-size:20px;font-weight:900;letter-spacing:-.01em;background:linear-gradient(90deg,#fff,#b9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:11.5px;color:var(--side-muted);font-style:italic;margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:none;border-radius:999px;cursor:pointer;color:var(--side-text);text-align:left;font-weight:700;position:relative;transition:all .25s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.nav-btn:hover{background:var(--side-hover);color:#fff;transform:translateX(3px)}
.nav-btn.on{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.45)}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn .pill{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);color:#fff;padding:1px 8px;border-radius:99px;font-weight:800;font-style:normal}
.nav-btn:not(.on) .pill{background:rgba(251,113,133,.2);color:#fda4af}
.kbd-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;margin-bottom:10px;border:1px solid var(--side-border);background:rgba(255,255,255,.04);border-radius:999px;cursor:pointer;color:var(--side-muted);font-size:13px;transition:all .2s}
.kbd-btn:hover{border-color:rgba(139,92,246,.5);color:var(--side-text)}
.kbd-btn kbd{margin-left:auto;font:800 10.5px var(--font);border:1px solid var(--side-border);border-radius:99px;padding:1px 7px}
.kbd-btn svg{width:15px;height:15px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.theme-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border:1px solid var(--side-border);background:rgba(255,255,255,.05);border-radius:999px;cursor:pointer;font-weight:700;color:var(--side-text);transition:all .2s}
.theme-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.upl-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border:0;background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(139,92,246,.25));border-radius:999px;cursor:pointer;color:#dfe6ff;font-weight:800;font-size:13px;transition:all .2s;box-shadow:inset 0 0 0 1px rgba(139,92,246,.4)}
.upl-btn:hover{background:var(--grad);color:#fff;transform:translateY(-2px)}
.upl-btn svg{width:16px;height:16px}
.src{font-size:11px;color:var(--side-muted);padding:0 8px;text-align:center}
main{padding:30px 36px 80px;min-width:0;max-width:1460px}
.top-mobile{display:none}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;margin-bottom:6px;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
.page-head h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.1;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.page-head p{margin:6px 0 0;color:var(--text-2);font-size:13.5px}
.section-title{font-size:20px;font-weight:900;margin:38px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em}
.section-title::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px var(--accent-soft)}
.section-title small{font-weight:600;color:var(--muted);font-size:12px}

.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-kpi{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);min-width:0;position:relative;transition:box-shadow .3s,transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,background .4s}
.card h3{margin:0 0 2px;font-size:15.5px;font-weight:900}
.card .sub{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mt{margin-top:16px}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:5px;overflow:hidden}
.kpi .lbl{font-size:12px;color:var(--text-2);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.kpi .val{font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.kpi.sm .val{font-size:21px}
.kpi .foot{font-size:12px;color:var(--muted);font-weight:600}
.kpi.click{cursor:pointer}
.kpi:hover,.hi:hover{transform:translateY(-5px);box-shadow:var(--shadow-h)}
.kpi .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.kpi .spark{margin-top:8px;height:38px;width:100%;display:block}
.kpi .spark rect{fill:transparent}
.kpi .spark rect:hover{fill:#fff;fill-opacity:.12}
/* Tarjetas con degradado */
.kpi.gx{border:0;color:#fff;background-size:160% 160%;animation:gshift 9s ease-in-out infinite alternate}
.kpi.gx::after{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-70px;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none;transition:transform .6s}
.kpi.gx::before{content:"";position:absolute;width:120px;height:120px;right:40px;bottom:-70px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.kpi.gx:hover::after{transform:scale(1.25)}
.kpi.gx .lbl,.kpi.gx .foot{color:rgba(255,255,255,.85)}
.kpi.gx .dot{background:#fff!important;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.kpi.gx .val,.kpi.gx .val *{color:#fff!important;-webkit-text-fill-color:#fff;background:none!important}
.kpi.gx .spark path.ln{stroke:#fff!important}
.kpi.gx .spark circle{fill:#fff!important}
.kpi.gx .spark stop{stop-color:#fff!important}
.gv{background:var(--g-ventas)}.gg{background:var(--g-gastos)}.gu{background:var(--g-util)}.gm{background:var(--g-margen)}.gc{background:var(--g-cobrar)}
.gv,.gg,.gu,.gm,.gc{box-shadow:0 14px 34px -12px rgba(60,60,160,.55)}
@keyframes gshift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.na{color:var(--muted)!important;font-size:14px!important;font-weight:700!important}
.kpi.gx .na{color:rgba(255,255,255,.8)!important}
.gold{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.note{font-size:12.5px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:12px 16px;margin-top:14px;display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(10px)}
.note b{font-weight:800;color:var(--text)}
.note .ic{width:22px;height:22px;flex:none;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}

/* Periodo */
.period{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;gap:2px;backdrop-filter:blur(10px)}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--text-2);transition:all .25s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.4)}
.period .arrow{color:var(--muted)}

/* Leyenda + gráficos */
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-2);background:var(--surface-2);border:1px solid transparent;border-radius:999px;padding:4px 11px;cursor:pointer;transition:all .2s}
.lg:hover{border-color:var(--accent);transform:translateY(-1px)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%}
.lg.off{opacity:.45;text-decoration:line-through}
.lg.off i{background:transparent!important;outline:1.5px solid var(--muted);outline-offset:-1.5px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--font);font-weight:700}
.chart .grid-l{stroke:var(--border);stroke-width:1;stroke-dasharray:3 5}
.chart .axis-l{stroke:var(--surface-3);stroke-width:1.5}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit.hov{fill:var(--accent);fill-opacity:.07}
.chart .dim{opacity:.28;transition:opacity .2s}
.chart .bar{transition:filter .2s}
.chart-empty{padding:50px 0;text-align:center;color:var(--muted);font-size:13px}
@keyframes grow{0%{transform:scaleY(0)}70%{transform:scaleY(1.06)}100%{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.anim .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.anim .bar.nb{transform-origin:50% 0}
.anim .ln{stroke-dasharray:1;animation:draw 1.2s cubic-bezier(.4,0,.2,1) both}
.anim .ar{animation:fadeIn .9s .4s both}
.anim .pt{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.fade>*{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
.fade>*:nth-child(2){animation-delay:.05s}.fade>*:nth-child(3){animation-delay:.1s}.fade>*:nth-child(4){animation-delay:.15s}.fade>*:nth-child(n+5){animation-delay:.2s}
.fade .grid>*{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
.grid>*:nth-child(1){animation-delay:.02s}.grid>*:nth-child(2){animation-delay:.07s}.grid>*:nth-child(3){animation-delay:.12s}.grid>*:nth-child(4){animation-delay:.17s}.grid>*:nth-child(5){animation-delay:.22s}.grid>*:nth-child(6){animation-delay:.27s}

.tip{position:fixed;z-index:120;pointer-events:none;background:var(--surface-solid);color:var(--text);border:1px solid var(--border);box-shadow:0 14px 40px rgba(20,30,80,.25);border-radius:18px;padding:10px 13px;font-size:12px;min-width:160px;opacity:0;transform:translateY(4px) scale(.97);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip .t{font-weight:900;margin-bottom:5px}
.tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--text-2);line-height:1.65}
.tip .r b{color:var(--text);font-weight:800}
.tip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tip .h{margin-top:6px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:800;text-align:center}

/* Pestañas */
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:999px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;color:var(--text-2);cursor:pointer;transition:all .25s}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(99,102,241,.35)}

/* Barras horizontales */
.hb{display:flex;flex-direction:column;gap:4px}
.hb-row{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:12px;align-items:center;font-size:13px;padding:6px 10px;border-radius:999px;transition:background .2s,transform .2s}
.hb-row.act{cursor:pointer}
.hb-row.act:hover{background:var(--accent-soft);transform:translateX(4px)}
.hb-row .l{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.hb-track{height:12px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.hb-fill{height:100%;background:linear-gradient(90deg,var(--c-ventas),var(--hi-ventas));border-radius:99px;transform-origin:left;animation:hbgrow 1s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 12px rgba(63,123,242,.35)}
@keyframes hbgrow{0%{transform:scaleX(0)}75%{transform:scaleX(1.02)}100%{transform:scaleX(1)}}
.hb-row .v{text-align:right;white-space:nowrap;font-weight:800}
.hb-row .v small{color:var(--muted);margin-left:6px;font-weight:600}

/* Tablas */
.tbl-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900;text-align:left;padding:8px 12px;white-space:nowrap;background:transparent;position:sticky;top:0;user-select:none}
th.sortable{cursor:pointer;transition:color .15s}
th.sortable:hover{color:var(--text)}
th.sortable.on{color:var(--accent-ink)}
th .ar{margin-left:4px;font-size:9px;opacity:.6}
th.on .ar{opacity:1}
td{padding:11px 12px;white-space:nowrap;background:var(--surface-2);transition:background .2s}
td:first-child{border-radius:16px 0 0 16px}
td:last-child{border-radius:0 16px 16px 0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--accent-soft)}
tbody tr{animation:fadeIn .4s both}
tfoot td{font-weight:900;background:transparent;border-top:2px solid var(--accent);border-radius:0!important;color:var(--text)}
.neg{color:var(--c-neg)}
.muted{color:var(--muted)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-venc{background:var(--crit-bg);color:var(--crit)}
.b-porv{background:var(--warn-bg);color:var(--warn)}
.b-pag{background:var(--good-bg);color:var(--good)}
.b-na{background:var(--surface-2);color:var(--muted)}
.chip-g{display:inline-block;font-size:10.5px;color:var(--accent-ink);background:var(--accent-soft);padding:2px 9px;border-radius:99px;font-weight:800;letter-spacing:.03em}

/* Filtros */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--border);background:var(--surface);border-radius:999px;outline:none;transition:all .25s;backdrop-filter:blur(10px);font-weight:600}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:800 10.5px var(--font);color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:1px 8px}
select.sel{padding:11px 16px;border:1px solid var(--border);background:var(--surface-solid);border-radius:999px;cursor:pointer;outline:none;font-weight:700}
select.sel:focus{border-color:var(--accent)}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:24px;padding:13px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:136px;transition:all .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);backdrop-filter:blur(10px);position:relative;overflow:hidden}
.chip:hover{border-color:var(--accent);transform:translateY(-4px)}
.chip.on{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 12px 30px -8px rgba(99,102,241,.6)}
.chip.on b,.chip.on small{color:rgba(255,255,255,.85)}
.chip b{font-size:11px;letter-spacing:.08em;color:var(--text-2);font-weight:900}
.chip span{font-size:19px;font-weight:900}
.chip small{font-size:11.5px;color:var(--muted);font-weight:600}
.chip .mini{height:5px;background:var(--surface-3);border-radius:99px;margin-top:7px;overflow:hidden}
.chip .mini i{display:block;height:100%;background:var(--grad);border-radius:99px}
.chip.on .mini{background:rgba(255,255,255,.25)}.chip.on .mini i{background:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;font-weight:700;background:var(--surface);border:1px solid var(--border);padding:10px 16px;border-radius:999px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.fchip{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;border-radius:99px;padding:5px 6px 5px 14px;font-size:12.5px;font-weight:800;box-shadow:0 6px 16px rgba(99,102,241,.35);animation:fadeUp .3s both}
.fchip button{border:0;background:rgba(255,255,255,.25);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1;color:#fff;font-weight:900}

/* Antigüedad */
.aging{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ag{border:1px solid var(--border);background:var(--surface);border-radius:24px;padding:15px 18px;cursor:pointer;text-align:left;transition:all .3s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.ag:hover{border-color:var(--accent);transform:translateY(-4px)}
.ag.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.ag .t{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2);font-weight:900}
.ag .v{font-size:21px;font-weight:900;margin:2px 0}
.ag .s{font-size:12px;color:var(--muted);font-weight:600}
.ag .bar{height:7px;border-radius:99px;background:var(--surface-3);margin-top:9px;overflow:hidden}
.ag .bar i{display:block;height:100%;border-radius:99px;animation:hbgrow 1s both;transform-origin:left}

/* Lista de deudores */
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:30px minmax(170px,2fr) 70px 1.3fr 1fr 124px 124px;gap:10px;align-items:center;padding:12px 14px;margin:5px 0;cursor:pointer;transition:all .25s cubic-bezier(.2,.8,.2,1);border-radius:20px;background:var(--surface-2);animation:fadeUp .4s both}
.drow:hover{background:var(--accent-soft);transform:translateX(4px)}
.drow.head{cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900;background:none;padding-top:6px;padding-bottom:4px;animation:none}
.drow.head:hover{transform:none;background:none}
.drow.picked{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.drow .nm{font-weight:900}
.drow .amt{font-weight:900;text-align:right;font-size:16px}
.drow .s{font-size:12px;color:var(--muted);font-weight:600}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-weight:700}
.ck{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);cursor:pointer;display:grid;place-items:center;transition:all .2s;margin:0;background:var(--surface-solid)}
.ck input:checked{background:var(--grad);border-color:transparent;box-shadow:0 0 0 3px var(--accent-soft)}
.ck input:checked::after{content:"✓";color:#fff;font-size:12px;font-weight:900;animation:pop .3s both}
.ck input:indeterminate{background:var(--accent);border-color:transparent}
.ck input:indeterminate::after{content:"–";color:#fff;font-weight:900;font-size:13px}

/* Botones */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;border:1px solid var(--border);background:var(--surface-solid);cursor:pointer;font-weight:800;white-space:nowrap;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
.btn.primary{background:var(--grad);background-size:200% 200%;border:0;color:#fff;box-shadow:0 10px 24px -6px rgba(99,102,241,.6);animation:gshift 6s ease-in-out infinite alternate}
.btn.primary:hover{color:#fff;box-shadow:0 14px 32px -6px rgba(99,102,241,.75);transform:translateY(-3px)}
.btn.soft-dis{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:none;padding:9px 12px}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.45);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(6,10,28,.45);backdrop-filter:blur(4px);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(610px,calc(100vw - 24px));background:var(--surface-solid);z-index:60;transform:translateX(110%);display:flex;flex-direction:column;border-radius:30px;overflow:hidden;border:1px solid var(--border);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.2,1),visibility 0s .45s}
.drawer.on{transform:none;visibility:visible;box-shadow:-20px 0 60px rgba(10,20,60,.35);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.dr-head{padding:22px 22px 18px;display:flex;gap:12px;align-items:center;background:var(--grad);color:#fff;position:relative;overflow:hidden}
.dr-head::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-110px;background:rgba(255,255,255,.14)}
.dr-head .btn.ghost{color:#fff;position:relative;z-index:1}
.dr-head .btn.ghost:hover{background:rgba(255,255,255,.15)}
.dr-head h2{margin:2px 0 6px;font-size:25px;font-weight:900}
.dr-head .lbl-s{color:rgba(255,255,255,.8)}
.dr-head .chip-g{background:rgba(255,255,255,.2);color:#fff}
.dr-av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.2);font-weight:900;font-size:20px;box-shadow:0 0 0 3px rgba(255,255,255,.3);position:relative;z-index:1}
.dr-nav{display:flex;gap:4px;align-items:center;position:relative;z-index:1}
.dr-nav span{font-size:12px;color:rgba(255,255,255,.85);padding:0 4px;font-weight:800}
.dr-body{padding:20px 22px;overflow-y:auto;flex:1}
.dr-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.dr-foot .btn{flex:1}
.saldo{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.qlist{display:flex;flex-direction:column;gap:8px;margin:16px 0 4px}
.qrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;background:var(--surface-2);border-radius:20px;padding:10px 16px;font-weight:700}
.msg{margin-top:16px;border:1px solid var(--border);border-radius:24px;padding:16px;background:linear-gradient(135deg,var(--accent-soft),transparent)}
.msg pre{white-space:pre-wrap;font:13px/1.55 var(--font);margin:8px 0 12px;color:var(--text-2);font-weight:600}
.msg .row{display:flex;gap:8px;flex-wrap:wrap}
.future{font-size:12px;color:var(--muted);margin-top:14px;border:1px dashed var(--border);border-radius:20px;padding:12px 14px}
.lbl-s{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:900}

/* Modal */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,10,28,.6);backdrop-filter:blur(6px)}
.modal.on{display:flex;animation:fadeIn .2s}
.modal-box{background:var(--surface-solid);border-radius:30px;max-width:800px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);animation:fadeUp .35s cubic-bezier(.2,.9,.2,1);box-shadow:0 30px 80px rgba(6,10,40,.5)}
.modal-box>.dr-head{flex-wrap:wrap}
.modal-box>.dr-head,.modal-box>.modal-foot,.drawer>.dr-head,.drawer>.dr-foot{flex-shrink:0}
.modal-body,.modal-box>.pad{flex:1 1 auto;min-height:0}
.modal-body{overflow:auto;padding:20px;background:var(--surface-2);text-align:center}
.modal-body img{max-width:100%;height:auto;border-radius:22px;box-shadow:0 14px 40px rgba(10,20,60,.3);animation:fadeUp .4s both}
.modal-foot{display:flex;gap:10px;padding:14px 18px;flex-wrap:wrap;border-top:1px solid var(--border);align-items:center}
.modal-foot .btn{flex:1}
.modal .seg{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);position:relative;z-index:1}
.modal .dr-head .seg button{color:rgba(255,255,255,.85)}
.modal .dr-head .seg button.on{background:#fff;color:#4338ca;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.dr-head .muted{color:rgba(255,255,255,.82)!important}

/* Buscador global */
.cmd{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(6,10,28,.55);backdrop-filter:blur(6px)}
.cmd.on{display:flex;animation:fadeIn .15s}
.cmd-box{width:100%;max-width:620px;background:var(--surface-solid);border:1px solid var(--border);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:fadeUp .25s}
.cmd-box input{width:100%;border:0;border-bottom:1px solid var(--border);background:none;padding:20px 24px;font-size:17px;outline:none;font-weight:700}
.cmd-res{max-height:52vh;overflow:auto;padding:8px}
.cmd-it{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:999px;cursor:pointer;transition:background .15s}
.cmd-it.sel{background:var(--accent-soft)}
.cmd-it .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);width:64px;flex:none;font-weight:900}
.cmd-it .n{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-it .v{font-size:12.5px;color:var(--text-2);font-weight:700}
.cmd-foot{font-size:11.5px;color:var(--muted);padding:10px 20px;border-top:1px solid var(--border);font-weight:600}

/* Salud */
.hi{display:flex;flex-direction:column;gap:4px;padding:17px 18px;border:1px solid var(--border);border-radius:24px;background:var(--surface);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;box-shadow:var(--shadow);backdrop-filter:blur(10px);position:relative;overflow:hidden}
.hi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent-soft)}
.hi .l{font-size:11px;color:var(--text-2);font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.hi .v{font-size:21px;font-weight:900}
.hi .d{font-size:12px;color:var(--muted);font-weight:600}
.hi.nd{background:transparent;border-style:dashed;box-shadow:none}
.hi.nd .v{font-size:13px;color:var(--muted);font-weight:800}
.up{color:var(--good)}.down{color:var(--c-neg)}

.dq{display:flex;flex-direction:column;gap:8px}
.dq-row{display:flex;gap:12px;align-items:flex-start;font-size:13px;padding:12px 16px;border-radius:20px;background:var(--surface-2);font-weight:600}
.dq-row .ic{flex:none;width:24px;height:24px;border-radius:50%;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center;font-weight:900}
.dq-row small{display:block;color:var(--muted);margin-top:2px;font-weight:500}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px) scale(.95);background:linear-gradient(135deg,#1e293b,#312e81);color:#eef2ff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:130;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.3,1.5,.5,1);max-width:90vw;box-shadow:0 14px 40px rgba(30,30,90,.45)}
.toast.on{opacity:1;transform:translateX(-50%)}
.back{margin-bottom:10px}
.mes-nav{display:flex;gap:6px}

/* Selección + lote + carga */
.selbar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);z-index:45;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0f172a,#1e1b4b);color:#eef2ff;border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 20px 50px rgba(20,20,80,.5);transition:transform .45s cubic-bezier(.3,1.4,.5,1);max-width:calc(100vw - 24px);flex-wrap:wrap;font-weight:700}
.selbar.on{transform:translate(-50%,0)}
.selbar b{color:#a5b4fc}
.selbar .btn{padding:10px 16px}
.selbar .btn.ghost{color:#c7d2fe}
.selbar .btn.ghost:hover{color:#fff}
.lote-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:14px;max-height:260px;overflow:auto}
.lote-thumbs img{width:100%;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:fadeUp .4s both}
.prog{height:12px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;width:0;background:var(--grad);background-size:200% 100%;border-radius:99px;transition:width .2s;animation:gshift 1.5s linear infinite alternate}
.opt-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.opt-row .seg,.modal-foot .seg{background:var(--surface-2);border-color:var(--border)}
.pad{padding:20px 22px;overflow:auto}
.field{display:flex;flex-direction:column;gap:5px;margin-top:10px;text-align:left}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:900}
.field textarea,.field input{width:100%;border:1px solid var(--border);background:var(--surface-solid);border-radius:18px;padding:10px 14px;font:600 13px/1.45 var(--font);outline:none;resize:vertical}
.field input{border-radius:999px}
.field textarea:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
details.custom{margin-top:14px;border:1px solid var(--border);border-radius:22px;padding:12px 18px;background:var(--surface-solid);text-align:left}
details.custom summary{cursor:pointer;font-weight:900;font-size:13px}
.drop{border:2px dashed var(--border);border-radius:28px;padding:36px 20px;text-align:center;cursor:pointer;transition:all .3s;background:linear-gradient(135deg,var(--accent-soft),transparent)}
.drop:hover,.drop.over{border-color:var(--accent);transform:scale(1.01);box-shadow:0 0 0 6px var(--accent-soft)}
.drop b{display:block;font-size:16px;margin:8px 0 4px;font-weight:900}
.drop .big{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:0 10px 24px rgba(99,102,241,.45);animation:floaty 3s ease-in-out infinite}
.drop-all{position:fixed;inset:0;z-index:140;display:none;align-items:center;justify-content:center;background:rgba(6,10,28,.75);backdrop-filter:blur(6px);color:#c7d2fe;font:900 24px var(--font);border:3px dashed #818cf8;margin:14px;border-radius:36px;pointer-events:none}
.drop-all.on{display:flex}
.rep{margin-top:14px;font-size:13px;font-weight:600}
.rep .ok{color:var(--good);font-weight:900}
.rep .err{color:var(--crit);font-weight:900}
.rep ul{margin:6px 0 0;padding-left:18px;color:var(--text-2)}
.src-card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 16px}
.src-card div{background:var(--surface-2);border-radius:20px;padding:11px 14px}
.src-card small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:900}
.src-card b{font-size:15px;font-weight:900}

/* Enviados */
.env-row{display:grid;grid-template-columns:46px minmax(180px,2fr) 1fr 1fr 1fr 110px auto;gap:12px;align-items:center;padding:12px 14px;margin:6px 0;border-radius:22px;background:var(--surface-2);animation:fadeUp .4s both;transition:background .2s}
.env-row:hover{background:var(--accent-soft)}
.env-row.pagado{opacity:.75}
.env-av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;font-weight:900}
.env-n{display:flex;flex-direction:column;min-width:0;cursor:pointer}
.env-n b{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env-n span{font-size:12px;color:var(--muted);font-weight:700}
.env-c{display:flex;flex-direction:column;font-size:12px;font-weight:700}
.env-c small{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:900}
.env-c b{font-size:15px;font-weight:900}
.env-c.r{text-align:right}
.env-a{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:1100px){.env-row{grid-template-columns:46px 1fr auto;}.env-row .env-c{display:none}.env-row .env-c.env-s{display:flex}.env-a{grid-column:1/4}}

/* Tesorería */
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card.acc{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;cursor:pointer;padding:18px}
.card.acc:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.card.acc.on{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow)}
.acc-av{border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.acc-t{display:flex;flex-direction:column;min-width:0}
.acc-t b{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-t span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-v{grid-column:1/3;font-size:27px;font-weight:900;letter-spacing:-.02em;margin-top:4px}
.acc-f{grid-column:1/3;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:800}
.acc-b{grid-column:1/3;display:flex;gap:8px;margin-top:6px}
.acc-b .btn{flex:1}
.card.acc-caja{background:linear-gradient(135deg,rgba(20,184,166,.16),var(--surface))}
.tes-empty{text-align:center;padding:36px 26px}
.tes-empty h2{margin:10px 0 6px;font-weight:900}
.tes-empty ul{text-align:left;max-width:620px;margin:10px auto 20px;color:var(--text-2);font-weight:600;line-height:1.7}
.tes-empty-ic{width:76px;height:76px;margin:0 auto;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:34px;box-shadow:0 12px 28px rgba(99,102,241,.45);animation:floaty 3s ease-in-out infinite}
.tes-cuadre{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding-right:4px}
.tes-row{display:grid;grid-template-columns:auto 1fr 160px;gap:12px;align-items:center;background:var(--surface-2);border-radius:20px;padding:8px 12px}
.tes-row input{width:100%;border:1px solid var(--border);background:var(--surface-solid);border-radius:999px;padding:9px 14px;font:800 15px var(--font);text-align:right;outline:none}
.tes-row input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tes-tipos{width:100%}.tes-tipos button{flex:1}
@media (max-width:600px){.tes-row{grid-template-columns:auto 1fr;}.tes-row input{grid-column:1/3}}

/* Reporte SI/NO */
.rep-form{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px}
.rep-form .field{margin-top:0}
.rep-form input[type=date]{border-radius:999px;padding:10px 14px}
.sn-wrap{overflow:auto;max-height:46vh;border-radius:20px;border:1px solid var(--border);margin-top:4px}
table.sn{border-spacing:0;font-size:12px}
table.sn th{background:var(--surface-solid);font-size:10px;line-height:1.3;padding:8px 6px;z-index:1}
table.sn td{padding:5px 6px;background:transparent;border-radius:0!important;border-bottom:1px solid var(--border)}
table.sn .sn-n{position:sticky;left:0;background:var(--surface-solid);text-align:left;font-weight:800;z-index:2;min-width:150px}
table.sn tr.sn-g td{background:var(--accent-soft);color:var(--accent-ink);font-weight:900;font-size:11px;letter-spacing:.06em}
table.sn tfoot td{background:var(--surface-2);font-weight:900}
.sn-si{display:inline-block;min-width:30px;padding:2px 8px;border-radius:99px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:900;font-size:11px}
.sn-no{color:var(--muted);font-weight:700;font-size:11px;opacity:.7}
@media (max-width:600px){.rep-form{grid-template-columns:1fr 1fr}.rep-form .field:last-child{grid-column:1/3}}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1250px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g-hero{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:10px;left:10px;right:10px;height:auto;flex-direction:row;padding:6px;border-radius:999px;z-index:40;gap:4px;box-shadow:0 12px 40px rgba(10,16,40,.45)}
  .brand,.side-foot,.kbd-btn,.upl-btn{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:11px;padding:8px 4px;justify-content:center;text-align:center}
  .nav-btn:hover{transform:none}
  .nav-btn .pill{position:absolute;top:3px;right:16%;margin:0}
  .top-mobile{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;margin:10px 10px 0;background:var(--side-bg);border-radius:999px;position:sticky;top:10px;z-index:30;box-shadow:0 10px 30px rgba(10,16,40,.3)}
  .top-mobile .tm-brand{display:flex;align-items:center;gap:10px}
  .top-mobile img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px rgba(139,92,246,.6)}
  .top-mobile b{font-size:16px;font-weight:900;background:linear-gradient(90deg,#fff,#b9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .top-mobile .tb{display:flex;gap:6px}
  .top-mobile button{width:38px;height:38px;border:0;background:rgba(255,255,255,.1);border-radius:50%;color:#fff;cursor:pointer}
  main{padding:20px 14px 110px}
  .g-2{grid-template-columns:1fr}
  .g-4,.aging{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drow{grid-template-columns:30px 1fr auto;gap:4px 10px}
  .drow.head{display:none}
  .drow .c-ped,.drow .c-old,.drow .c-new{display:none}
  .drow .ck{grid-row:1/3}
  .drow .c-est{grid-column:2}
  .drow .amt{grid-row:1/3;grid-column:3}
  .drow .mob{display:block!important}
  .search kbd{display:none}
  .selbar{bottom:96px}
  .src-card{grid-template-columns:1fr 1fr}
  .drawer{top:0;right:0;bottom:0;width:100vw;border-radius:0}
}
@media (max-width:600px){
  .g-kpi,.g-hero{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:22px}
  .kpi.sm .val{font-size:18px}
  .card{padding:16px;border-radius:22px}
  .tbl-wrap{margin:0 -16px;padding:0 16px}
  .page-head h1{font-size:27px}
  .chip{min-width:0;flex:1 1 40%}
  .period{width:100%}
  .seg{width:100%}.seg button{flex:1;padding:8px 6px}
  .period select{flex:1 1 40%;min-width:0}
  .period .arrow{display:none}
  .selbar{left:10px;right:10px;transform:translateY(200%);max-width:none;flex-wrap:nowrap;justify-content:space-between;gap:8px;padding:6px 6px 6px 16px;font-size:12.5px}
  .selbar.on{transform:none}
  .selbar .btn{padding:9px 12px;font-size:12.5px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ---- Conexión Google Drive ---- */
.sync-chip{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;border:0;border-radius:999px;background:rgba(255,255,255,.06);color:var(--side-muted);font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;text-align:left;transition:background .2s}
.sync-chip:hover{background:rgba(255,255,255,.12)}
.sync-chip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-chip i,.sync-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#16a89a;box-shadow:0 0 0 3px rgba(22,168,154,.2)}
.sync-dot{display:inline-block}
.sync-chip.work i,.sync-dot.work{background:#3f7bf2;box-shadow:0 0 0 3px rgba(63,123,242,.25);animation:pulse 1s ease-in-out infinite}
.sync-chip.warn i,.sync-dot.warn{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.sync-chip.warn{color:#fbbf24}
.sync-chip.nuevo i,.sync-dot.nuevo{background:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.3);animation:pulse 1.2s ease-in-out infinite}
.sync-chip.nuevo{color:#c4b5fd}
.login{position:fixed;inset:0;z-index:210;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 35%,#16215a,#060914 72%)}
.login[hidden]{display:none}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 26px;border-radius:28px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.45);color:#e6ebff;text-align:center}
.login-card .ring{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center}
.login-card .ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#3b82f6,#8b5cf6,#22d3ee,#3b82f6);animation:spin 3s linear infinite;-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%)}
.login-card img{width:92px;height:92px;border-radius:50%}
.login-card h1{margin:4px 0 0;font-size:22px}
.login-card p{margin:0;color:#b9c4ee;font-size:13.5px}
.login-card .field{width:100%;text-align:left}
.login-card .field label{color:#b9c4ee}
.login-card input{width:100%;box-sizing:border-box}
.login-card .btn{width:100%;justify-content:center;padding:12px}
.login-card small{color:#8c97c2;font-size:11px}
.login-err{min-height:16px;color:#fca5a5;font-size:12.5px;font-weight:700}
.nav-btn .pill:empty{display:none}
</style>
</head>

<script>
'use strict';
/* =========================================================
   1. CONFIGURACIÓN
   ========================================================= */
const CONFIG = {
  negocio: "ALMUERZOS D'ELIZ",
  apiUrl: 'https://script.google.com/macros/s/AKfycbwGOps7emkX9pwHlpd5HZuq5fE9I-Pe9TEmDvxqiY1RyQxFSDBsAXqbHHASs59HyL9e/exec',   // URL /exec de Apps Script. Vacío = se pide en la pantalla de acceso
  formasPendientes: ['PTE', ''],   // Igual que REGISTRO PAGOS: FORMA vacía o "PTE" = pendiente
  fechaReferencia: null,            // null = hoy. 'YYYY-MM-DD' para simular otra fecha de corte
  diasClienteActivo: 30,
  umbralDobleColumna: 14,
  filasPorPagina: 100,
  storageTema: 'deliz-tema',
  storageDatos: 'deliz-datos',      // base cargada por el usuario (se recuerda al reabrir el HTML)
  storageImg: 'deliz-img',          // personalización del estado de cuenta
  tramosDeuda: [{l:'0–15 días',a:0,b:15},{l:'16–30 días',a:16,b:30},{l:'31–60 días',a:31,b:60},{l:'Más de 60 días',a:61,b:1e9}]
};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_C = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* =========================================================
   2. UTILIDADES
   ========================================================= */
const U = {
  r2: n => Math.round((n + Number.EPSILON) * 100) / 100,
  money(n){ if(n==null||isNaN(n)) return '—'; const s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?'-$':'$')+s; },
  moneyShort(n){ const a=Math.abs(n); const s = a>=1000 ? (a/1000).toFixed(a>=10000?0:1).replace(/\.0$/,'')+'k' : a.toFixed(0); return (n<0?'-$':'$')+s; },
  pct(n,d=1){ return n==null||!isFinite(n) ? '—' : (n*100).toFixed(d)+'%'; },
  int(n){ return n==null||isNaN(n)?'—':Math.round(n).toLocaleString('en-US'); },
  dec1(n){ return n==null||isNaN(n)?'—':n.toFixed(1); },
  parse(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); },
  iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  fdate(d){ return d ? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear() : '—'; },
  fdateShort(d){ return d ? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0') : '—'; },
  mesKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); },
  mesLabel(k,short){ const [y,m]=k.split('-').map(Number); return short ? MESES_C[m-1] : MESES[m-1]+' '+y; },
  dias(a,b){ return Math.round((b-a)/86400000); },
  esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  norm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); },
  sum(arr,f){ let t=0; for(const x of arr) t+=f?f(x):x; return t; },
  cap(s){ s=String(s||''); return s.charAt(0)+s.slice(1).toLowerCase(); },
  hoy(){ if(CONFIG.fechaReferencia) return U.parse(CONFIG.fechaReferencia); const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
};
const FMT = { money:U.money, int:U.int, pct:v=>U.pct(v), dec1:U.dec1 };

/* =========================================================
   3. FUENTE DE DATOS  (único punto a reemplazar para una API)
     async cargar(){ const r = await fetch('/api/datos'); return this.normalizar(await r.json()); }
   Contrato de salida:
     ventas: [{fecha:'YYYY-MM-DD', cliente, grupo, valor, cantidad, forma, factura, fechaPago, banco, destinatario}]
     gastos: [{fecha:'YYYY-MM-DD', valor, concepto, categoria}]
   ========================================================= */
const DataSource = {
  meta: {}, origen: 'drive', rep: null,
  /* Respuesta de Apps Script → mismo contrato que el lector de Excel */
  desdeServidor(r){
    const hojas=(r.hojas||[]).map(h=>({nombre:h.nombre, filas:h.filas, d1904:false}));
    const {datos,rep}=Importador.procesar(hojas, r.archivo||'Google Sheets');
    const m=String(r.leido||'').match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d:\d\d)/);
    this.rep=rep; this.meta={fuente:r.archivo||'Google Sheets', exportado:m?`${m[3]}/${m[2]}/${m[1]} ${m[4]}`:''};
    return datos;
  },
  comprimir(datos, meta){
    const dic={cliente:[],grupo:[],forma:[],banco:[],destinatario:[]}, ix={};
    const enc=(c,v)=>{ const m=ix[c]||(ix[c]=new Map()); if(!m.has(v)){ m.set(v,dic[c].length); dic[c].push(v); } return m.get(v); };
    return { meta, dic,
      ventas:{cols:['fecha','cliente','grupo','valor','cantidad','forma','factura','fechaPago','banco','destinatario'],
        rows:datos.ventas.map(v=>[v.fecha,enc('cliente',v.cliente),enc('grupo',v.grupo),v.valor,v.cantidad,enc('forma',v.forma),v.factura||'',v.fechaPago||'',enc('banco',v.banco||''),enc('destinatario',v.destinatario||'')])},
      gastos:{cols:['fecha','valor','concepto','categoria'], rows:datos.gastos.map(g=>[g.fecha,g.valor,g.concepto||'',g.categoria||''])},
      contactos:(datos.contactos||[]).map(c=>[c.cliente,c.grupo,c.telefono]) };
  },
  normalizar(raw){
    const D = raw.dic, vc = raw.ventas.cols, idx = n => vc.indexOf(n), dec = (col,v) => D[col] ? D[col][v] : v;
    const ventas = raw.ventas.rows.map(r => ({
      fecha: r[idx('fecha')], cliente: dec('cliente', r[idx('cliente')]), grupo: dec('grupo', r[idx('grupo')]),
      valor: +r[idx('valor')], cantidad: +r[idx('cantidad')], forma: dec('forma', r[idx('forma')]),
      factura: r[idx('factura')] || '', fechaPago: r[idx('fechaPago')] || '',
      banco: dec('banco', r[idx('banco')]) || '', destinatario: dec('destinatario', r[idx('destinatario')]) || ''
    }));
    // Concepto/categoría solo existen si la hoja de egresos trae esas columnas
    const gastos = raw.gastos.rows.map(r => ({ fecha:r[0], valor:+r[1], concepto:r[2]||null, categoria:r[3]||null }));
    const contactos = (raw.contactos||[]).map(r => ({ cliente:r[0], grupo:r[1], telefono:r[2] }));
    return { ventas, gastos, contactos };
  }
};

/* Contactos: normaliza teléfonos de Ecuador a formato WhatsApp (593XXXXXXXXX) y los une a cada cliente */
const Contactos = {
  normalizar(v){ if(v==null||v==='') return ''; let d=String(typeof v==='number'?Math.round(v):v).replace(/\D/g,'');
    if(!d) return ''; if(d.startsWith('00')) d=d.slice(2);
    if(d.startsWith('593')) return d.length>=11?d:'';
    if(d.length===10 && d.startsWith('0')) return '593'+d.slice(1);
    if(d.length===9 && d.startsWith('9')) return '593'+d;
    return d.length>=8?d:''; },
  mostrar(t){ if(!t) return ''; if(t.startsWith('593')&&t.length===12) return '0'+t.slice(3,5)+' '+t.slice(5,8)+' '+t.slice(8); return '+'+t; },
  /* Unión estricta: filtro 1 = GRUPO, filtro 2 = NOMBRE. Un mismo nombre en dos grupos son dos clientes distintos. */
  aplicar(M, lista){
    const porGrupo=new Map();
    (lista||[]).forEach(c=>{ if(!c.telefono||!c.grupo) return; porGrupo.set(U.norm(c.grupo)+'|'+U.norm(c.cliente),c.telefono); });
    let n=0; for(const c of M.clientes.values()){ c.telefono=porGrupo.get(U.norm(c.grupo)+'|'+U.norm(c.nombre))||''; if(c.telefono) n++; }

};

/* =========================================================
   3b. LECTOR DE EXCEL (.xlsx/.xlsm) SIN LIBRERÍAS
   Descomprime el archivo con DecompressionStream (nativo de Chrome/Edge)
   y lee las hojas XML. Solo lectura de valores (usa el último valor
   calculado de las fórmulas, tal como lo guardó Excel).
   ========================================================= */
const XLSXLite = {
  async leer(file){
    const buf=await file.arrayBuffer(), dv=new DataView(buf), u8=new Uint8Array(buf), td=new TextDecoder();
    let e=buf.byteLength-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
    if(e<0) throw new Error('El archivo no es un Excel .xlsx válido.');
    const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const ent={};
    for(let i=0;i<n;i++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
      ent[td.decode(u8.subarray(p+46,p+46+nl))]={method,csize,lho}; p+=46+nl+el+cl;
    }
    const texto=async name=>{
      const f=ent[name]; if(!f) return null;
      const s=f.lho+30+dv.getUint16(f.lho+26,true)+dv.getUint16(f.lho+28,true), data=u8.slice(s,s+f.csize);
      if(f.method===0) return td.decode(data);
      if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no puede leer Excel. Usa Google Chrome o Edge actualizado.');
      const out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return td.decode(out);
    };
    const xml=s=>new DOMParser().parseFromString(s,'application/xml'), tags=(d,t)=>[...d.getElementsByTagNameNS('*',t)];
    const wb=xml(await texto('xl/workbook.xml')||'');
    const d1904 = tags(wb,'workbookPr').some(x=>['1','true'].includes(x.getAttribute('date1904')));
    const rels=xml(await texto('xl/_rels/workbook.xml.rels')||''), relMap={};
    tags(rels,'Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
    const ssTxt=await texto('xl/sharedStrings.xml'), ss=ssTxt? tags(xml(ssTxt),'si').map(si=>tags(si,'t').map(t=>t.textContent).join('')) : [];
    const hojas=[];
    for(const sh of tags(wb,'sheet')){
      const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id');
      let tgt=relMap[rid]||''; tgt=tgt.startsWith('/')?tgt.slice(1):'xl/'+tgt.replace(/^\.\//,'');
      const t=await texto(tgt); if(!t) continue;
      const filas=[];
      for(const row of tags(xml(t),'row')){
        const ri=(+row.getAttribute('r')||filas.length+1)-1, arr=[]; let ci=0;
        for(const c of tags(row,'c')){
          const ref=c.getAttribute('r'); if(ref){ ci=0; for(const ch of ref.replace(/\d+/g,'')) ci=ci*26+ch.charCodeAt(0)-64; ci--; }
          const tp=c.getAttribute('t'), vEl=tags(c,'v')[0], v=vEl?vEl.textContent:null; let val=null;
          if(tp==='s') val=v!=null?ss[+v]:null; else if(tp==='inlineStr') val=tags(c,'t').map(x=>x.textContent).join('');
          else if(tp==='str') val=v; else if(tp==='b') val=v==='1'; else if(tp==='e') val=null; else val=v!=null&&v!==''?+v:null;
          arr[ci]=val; ci++;
        }
        filas[ri]=arr;
      }
      hojas.push({nombre:sh.getAttribute('name'), filas, d1904});
    }
    return hojas;
  }
};

/* Convierte las hojas leídas al contrato {ventas, gastos} y genera un reporte de validación */
const Importador = {
  ALIAS_V:{fecha:['fecha'],cliente:['cliente'],grupo:['grupo'],valor:['valor','total'],cantidad:['cantidad','cant','cant.'],forma:['forma','forma de pago'],factura:['factura'],fechaPago:['fecha de pago','fecha pago'],banco:['banco'],destinatario:['destinatario']},
  ALIAS_C:{cliente:['cliente','nombre'],grupo:['grupo'],telefono:['telefono','teléfono','celular','whatsapp','numero','número','movil','móvil']},
  ALIAS_G:{fecha:['fecha'],valor:['total egresos del dia','total egresos','total del dia','egresos','valor','monto','total'],concepto:['concepto','detalle','descripcion'],categoria:['categoria','tipo','rubro']},
  cabecera(filas, alias, req){
    for(let r=0;r<Math.min(filas.length,15);r++){
      const f=filas[r]; if(!f) continue; const h=f.map(x=>U.norm(x)), map={};
      for(const [k,al] of Object.entries(alias)){ for(const a of al){ const i=h.indexOf(a); if(i>=0 && !Object.values(map).includes(i)){ map[k]=i; break; } } }
      if(req.every(k=>map[k]!=null)) return {fila:r, map};
    }
    return null;
  },
  fecha(v, d1904){
    if(v==null||v==='') return null;
    if(typeof v==='number'){ if(v<1) return null; const d=new Date(Date.UTC(d1904?1904:1899, d1904?0:11, d1904?1:30)+Math.round(v)*864e5); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
    const s=String(v).trim(); let m;
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
    return null;
  },
  num(v){ if(typeof v==='number') return v; if(v==null||v==='') return null; const n=parseFloat(String(v).replace(/[$\s]/g,'').replace(',','.')); return isNaN(n)?null:n; },
  txt(v){ return v==null?'':String(v).trim(); },
  procesar(hojas, archivo){
    const rep={archivo, hojaV:null, hojaG:null, nV:0, nG:0, omit:[], avisos:[]};
    let hv=null, hg=null;
    for(const h of hojas){ if(!hv){ const c=this.cabecera(h.filas,this.ALIAS_V,['fecha','cliente','valor']); if(c){ hv={h,c}; continue; } } if(!hg){ const c=this.cabecera(h.filas,this.ALIAS_G,['fecha','valor']); if(c && !this.cabecera(h.filas,this.ALIAS_V,['cliente'])) hg={h,c}; } }
    if(!hv) throw new Error('No encontré una hoja de ventas con columnas FECHA, CLIENTE y VALOR.');
    rep.hojaV=hv.h.nombre; const M=hv.c.map, ventas=[];
    if(M.grupo==null) rep.avisos.push('La hoja de ventas no tiene columna GRUPO: se usará "SIN GRUPO".');
    if(M.forma==null) rep.avisos.push('No hay columna FORMA: todos los registros se tratarán como pendientes.');
    let sinCant=0;
    for(let r=hv.c.fila+1;r<hv.h.filas.length;r++){
      const f=hv.h.filas[r]; if(!f) continue; const g=k=>M[k]!=null?f[M[k]]:null;
      const cli=this.txt(g('cliente')), fe=this.fecha(g('fecha'),hv.h.d1904), val=this.num(g('valor'));
      if(!cli && g('fecha')==null && g('valor')==null) continue;
      if(!fe){ rep.omit.push({hoja:rep.hojaV,fila:r+1,motivo:'Fecha vacía o inválida'}); continue; }
      if(!cli){ rep.omit.push({hoja:rep.hojaV,fila:r+1,motivo:'Cliente vacío'}); continue; }
      if(val==null){ rep.omit.push({hoja:rep.hojaV,fila:r+1,motivo:'Valor vacío o no numérico'}); continue; }
      let cant=this.num(g('cantidad')); if(cant==null){ cant=1; sinCant++; }
      ventas.push({fecha:fe, cliente:cli.toUpperCase(), grupo:(this.txt(g('grupo'))||'SIN GRUPO').toUpperCase(), valor:Math.round(val*100)/100, cantidad:cant,
        forma:this.txt(g('forma')).toUpperCase(), factura:this.txt(g('factura')), fechaPago:this.fecha(g('fechaPago'),hv.h.d1904)||'', banco:this.txt(g('banco')).toUpperCase(), destinatario:this.txt(g('destinatario')).toUpperCase()});
    }
    if(sinCant) rep.avisos.push(`${sinCant} registro(s) sin CANTIDAD: se asumió 1 almuerzo.`);
    const gastos=[];
    if(hg){ rep.hojaG=hg.h.nombre; const G=hg.c.map;
      for(let r=hg.c.fila+1;r<hg.h.filas.length;r++){
        const f=hg.h.filas[r]; if(!f) continue; const g=k=>G[k]!=null?f[G[k]]:null;
        if(g('fecha')==null && g('valor')==null) continue;
        const fe=this.fecha(g('fecha'),hg.h.d1904), val=this.num(g('valor'));
        if(!fe){ rep.omit.push({hoja:rep.hojaG,fila:r+1,motivo:'Fecha de egreso inválida'}); continue; }
        if(val==null){ rep.omit.push({hoja:rep.hojaG,fila:r+1,motivo:'Valor de egreso no numérico'}); continue; }
        gastos.push({fecha:fe, valor:Math.round(val*100)/100, concepto:this.txt(g('concepto'))||null, categoria:this.txt(g('categoria'))||null});
      }
      if(G.categoria!=null) rep.avisos.push('Se detectó columna de CATEGORÍA en egresos: se activa el análisis por categoría.');
    } else rep.avisos.push('No encontré una hoja de egresos (FECHA + TOTAL/VALOR): gastos y utilidad quedarán sin datos.');
    // Hoja de contactos (CLIENTE, GRUPO, TELEFONO)
    const contactos=[]; const hc=hojas.find(h=>h!==hv.h && h!==(hg&&hg.h) && this.cabecera(h.filas,this.ALIAS_C,['cliente','telefono']));
    if(hc){ const cab=this.cabecera(hc.filas,this.ALIAS_C,['cliente','telefono']), C=cab.map;
      for(let r=cab.fila+1;r<hc.filas.length;r++){ const f=hc.filas[r]; if(!f) continue; const cli=this.txt(f[C.cliente]); if(!cli) continue;
        contactos.push({cliente:cli.toUpperCase(), grupo:C.grupo!=null?this.txt(f[C.grupo]).toUpperCase():'', telefono:Contactos.normalizar(f[C.telefono])}); }
      rep.hojaC=hc.nombre; rep.nC=contactos.length; rep.nCsin=contactos.filter(c=>!c.telefono).length; }
    if(!ventas.length) throw new Error('La hoja de ventas no tiene registros válidos.');
    rep.nV=ventas.length; rep.nG=gastos.length;
    return {datos:{ventas,gastos,contactos}, rep};
  }
};

/* =========================================================
   3c. ZIP (sin compresión: los PNG ya vienen comprimidos)
   ========================================================= */
const Zip = {
  tabla: (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })(),
  crc(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=Zip.tabla[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; },
  crear(archivos){ // [{name, data:Uint8Array}]
    const te=new TextEncoder(), partes=[], central=[]; let off=0;
    const d=new Date(), dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
    for(const a of archivos){
      const nm=te.encode(a.name), crc=Zip.crc(a.data), sz=a.data.length;
      const h=new DataView(new ArrayBuffer(30));
      h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,dt,true); h.setUint16(12,dd,true);
      h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
      partes.push(h.buffer,nm,a.data);
      const c=new DataView(new ArrayBuffer(46));
      c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true); c.setUint16(12,dt,true); c.setUint16(14,dd,true);
      c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
      central.push(c.buffer,nm); off+=30+nm.length+sz;
    }
    const csz=central.reduce((s,b)=>s+(b.byteLength||b.length),0), e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true); e.setUint16(8,archivos.length,true); e.setUint16(10,archivos.length,true); e.setUint32(12,csz,true); e.setUint32(16,off,true);
    return new Blob([...partes,...central,e.buffer],{type:'application/zip'});
  }
};

/* =========================================================
   4. PAGOS (preparado para versión futura — NO guarda nada)
   Pago previsto: { id, clienteKey, fecha, valor, metodo, referencia, observacion }
   Cuando exista backend: registrar() hace POST, se agrega a `lista`
   y Calc.saldo() descuenta automáticamente del pendiente.
   ========================================================= */
const Pagos = {
  lista: [], habilitado: false,
  async registrar(/* pago */){ throw new Error('NO_IMPLEMENTADO'); },
  cache:null,
  totalCliente(key){ return this.cache ? (this.cache.get(key)||0) : 0; }
};

/* =========================================================
   5. CÁLCULOS (funciones puras)
   ========================================================= */
const Calc = {
  construirModelo(datos){
    const hoy = U.hoy();
    const ventas = datos.ventas.map((v,i) => {
      const f = U.parse(v.fecha), y=f.getFullYear(), m=f.getMonth(), dia=f.getDate(), q = dia<=15 ? 1 : 2;
      const vence = q===1 ? new Date(y,m,15) : new Date(y,m+1,0);
      const pendiente = CONFIG.formasPendientes.includes((v.forma||'').trim());
      return { ...v, id:i, f, mes:U.mesKey(f), q, vence, pendiente, fp:U.parse(v.fechaPago), key:v.cliente+'|'+v.grupo,
        estado: pendiente ? (vence < hoy ? 'vencido' : 'porvencer') : 'pagado' };
    }).sort((a,b)=>a.f-b.f || a.id-b.id);
    { const cnt=new Map(); for(const v of ventas){ const b=`${v.fecha}|${v.key}|${v.valor}|${v.cantidad}`, n=(cnt.get(b)||0)+1; cnt.set(b,n); v.sig=b+'#'+n; } }
    const gastos = datos.gastos.map(g => ({...g, f:U.parse(g.fecha), mes:U.mesKey(U.parse(g.fecha))})).sort((a,b)=>a.f-b.f);
    const meses = [...new Set([...ventas.map(v=>v.mes), ...gastos.map(g=>g.mes)])].sort();
    return { ventas, gastos, clientes:Calc.agruparClientes(ventas), meses, grupos:[...new Set(ventas.map(v=>v.grupo))].sort(),
      fechaMin: ventas[0]?.f||null, fechaMax: ventas[ventas.length-1]?.f||null, hoy };
  },
  // Clave de cliente = CLIENTE|GRUPO (igual que la columna CLAVE de la hoja)
  agruparClientes(ventas){
    const clientes = new Map();
    for(const v of ventas){
      let c = clientes.get(v.key);
      if(!c){ c={key:v.key,nombre:v.cliente,grupo:v.grupo,pedidos:[],total:0,almuerzos:0,pendiente:0,nPend:0,almPend:0,vencido:0,primeraPend:null,ultimaPend:null,ultima:null,primera:v.f,busq:U.norm(v.cliente+' '+v.grupo)}; clientes.set(v.key,c); }
      c.pedidos.push(v); c.total+=v.valor; c.almuerzos+=v.cantidad; c.ultima=v.f;
      if(v.pendiente){ c.pendiente+=v.valor; c.nPend++; c.almPend+=v.cantidad; if(v.estado==='vencido') c.vencido+=v.valor; if(!c.primeraPend) c.primeraPend=v.f; c.ultimaPend=v.f; }
    }
    return clientes;
  },
  subModelo(M,d,h){
    const inR=k=>k>=d&&k<=h, ventas=M.ventas.filter(v=>inR(v.mes)), gastos=M.gastos.filter(g=>inR(g.mes));
    return {...M, ventas, gastos, clientes:Calc.agruparClientes(ventas), meses:M.meses.filter(inR), fechaMin:ventas[0]?.f||null, fechaMax:ventas[ventas.length-1]?.f||null};
  },
  saldo(c){ return Math.max(0,U.r2(c.pendiente - Pagos.totalCliente(c.key))); },

  mensual(M){
    const map = new Map(M.meses.map(k=>[k,{mes:k,ventas:0,almuerzos:0,pedidos:0,cli:new Set(),dv:new Set(),gastos:null,dg:new Set(),pendiente:0}]));
    for(const v of M.ventas){ const a=map.get(v.mes); a.ventas+=v.valor; a.almuerzos+=v.cantidad; a.pedidos++; a.cli.add(v.key); a.dv.add(v.fecha); if(v.pendiente) a.pendiente+=v.valor; }
    for(const g of M.gastos){ const a=map.get(g.mes); a.gastos=(a.gastos||0)+g.valor; if(g.valor>0) a.dg.add(g.fecha); }
    let prev=null;
    return [...map.values()].map(a=>{
      const o = { mes:a.mes, ventas:U.r2(a.ventas), gastos:a.gastos==null?null:U.r2(a.gastos), almuerzos:a.almuerzos, pedidos:a.pedidos,
        clientes:a.cli.size, diasVenta:a.dv.size, diasGasto:a.dg.size, pendiente:U.r2(a.pendiente) };
      o.utilidad = o.gastos==null ? null : U.r2(o.ventas-o.gastos);
      o.margen = o.gastos==null || !o.ventas ? null : o.utilidad/o.ventas;
      o.promDiario = o.diasVenta ? o.ventas/o.diasVenta : null;
      o.ticket = o.pedidos ? o.ventas/o.pedidos : null;
      o.crec = prev && prev.ventas ? (o.ventas-prev.ventas)/prev.ventas : null;
      prev=o; return o;
    });
  },

  kpis(M, mensual){
    const V=M.ventas, ventas=U.sum(V,v=>v.valor), gastos=U.sum(M.gastos,g=>g.valor);
    const comp = mensual.filter(m=>m.gastos!=null && m.ventas>0);   // periodo comparable
    const vComp=U.sum(comp,m=>m.ventas), gComp=U.sum(comp,m=>m.gastos);
    const diasV=new Set(V.map(v=>v.fecha)).size, diasG=new Set(M.gastos.filter(g=>g.valor>0).map(g=>g.fecha)).size;
    let activos=0, corte=null;
    if(M.fechaMax){ corte=new Date(M.fechaMax); corte.setDate(corte.getDate()-(CONFIG.diasClienteActivo-1)); activos=new Set(V.filter(v=>v.f>=corte).map(v=>v.key)).size; }
    const deudores=[...M.clientes.values()].filter(c=>Calc.saldo(c)>0.004), pend=V.filter(v=>v.pendiente);
    return {
      ventas, gastos, almuerzos:U.sum(V,v=>v.cantidad), pedidos:V.length,
      comp, vComp, gComp, utilidad:vComp-gComp, margen: vComp? (vComp-gComp)/vComp : null,
      mesesExcluidos: mensual.filter(m=>m.gastos==null && m.ventas>0).map(m=>U.mesLabel(m.mes)),
      compDesde: comp.length?comp[0].mes:null, compHasta: comp.length?comp[comp.length-1].mes:null,
      ticket: V.length? ventas/V.length : null, ventaDiaria: diasV? ventas/diasV : null, diasV,
      gastoDiario: diasG? gastos/diasG : null, diasG, activos, corteActivos:corte,
      deudores: deudores.length, pendiente: U.sum(deudores,c=>Calc.saldo(c)), pedidosPend: pend.length,
      vencido: U.sum(pend.filter(v=>v.estado==='vencido'),v=>v.valor), porVencer: U.sum(pend.filter(v=>v.estado==='porvencer'),v=>v.valor),
      almDia: diasV ? U.sum(V,v=>v.cantidad)/diasV : null
    };
  },
  porGrupo(ventas){
    const m=new Map(); for(const v of ventas){ const a=m.get(v.grupo)||{grupo:v.grupo,ventas:0,pend:0,nPend:0,cli:new Set()}; a.ventas+=v.valor; a.cli.add(v.key); if(v.pendiente){a.pend+=v.valor;a.nPend++;} m.set(v.grupo,a); }
    return [...m.values()].sort((a,b)=>b.ventas-a.ventas);
  },
  porDiaSemana(ventas){
    const a = Array.from({length:7},(_,i)=>({dia:i,total:0,fechas:new Set()}));
    for(const v of ventas){ const d=a[v.f.getDay()]; d.total+=v.valor; d.fechas.add(v.fecha); }
    return a.map(d=>({dia:d.dia,total:d.total,n:d.fechas.size,prom:d.fechas.size?d.total/d.fechas.size:0}));
  },
  salud(M, mensual, K){
    const conV=mensual.filter(m=>m.ventas>0), last=conV[conV.length-1], prev=conV[conV.length-2];
    const conG=mensual.filter(m=>m.gastos!=null && m.gastos>0), gL=conG[conG.length-1], gP=conG[conG.length-2];
    const enCurso = M.fechaMax && last && last.mes===U.mesKey(M.fechaMax) && M.fechaMax < new Date(M.fechaMax.getFullYear(), M.fechaMax.getMonth()+1, 0);
    const cli=[...M.clientes.values()].sort((a,b)=>b.total-a.total), top10=U.sum(cli.slice(0,10),c=>c.total), grp=Calc.porGrupo(M.ventas);
    const pagados=M.ventas.filter(v=>!v.pendiente && v.fp), validos=pagados.filter(v=>v.fp>=v.f);
    const dsem=Calc.porDiaSemana(M.ventas).filter(d=>d.n>=4).sort((a,b)=>b.prom-a.prom);
    return {
      crec: last&&prev ? {v:(last.ventas-prev.ventas)/prev.ventas, d:`${U.mesLabel(last.mes,1)} vs ${U.mesLabel(prev.mes,1)}${enCurso?' · mes en curso (datos al '+U.fdateShort(M.fechaMax)+')':''}`} : null,
      varG: gL&&gP ? {v:(gL.gastos-gP.gastos)/gP.gastos, d:`${U.mesLabel(gL.mes,1)} vs ${U.mesLabel(gP.mes,1)}`} : null,
      utilProm: K.comp.length ? K.utilidad/K.comp.length : null,
      top10: K.ventas? top10/K.ventas : null, grpTop: grp[0] ? {g:grp[0].grupo, p:grp[0].ventas/K.ventas} : null,
      pctPend: K.ventas ? K.pendiente/K.ventas : null,
      diasCobro: validos.length ? U.sum(validos,v=>U.dias(v.f,v.fp))/validos.length : null, nCobro: validos.length, nCobroExcl: pagados.length-validos.length,
      diaTop: dsem[0]||null, best: [...conV].sort((a,b)=>b.ventas-a.ventas)[0],
      cliIni: conV[0] ? {mes:conV[0].mes, n:conV[0].clientes} : null, cliFin: last ? {mes:last.mes,n:last.clientes} : null
    };
  },
  calidad(M, mensual){
    const out=[], sinG=mensual.filter(m=>m.ventas>0 && m.gastos==null);
    if(sinG.length) out.push({t:`${sinG.length} mes(es) con ventas pero sin egresos registrados: ${sinG.map(m=>U.mesLabel(m.mes)).join(', ')}`, d:'Se excluyen del cálculo de utilidad y margen para no inflarlos.'});
    const diasG=new Set(M.gastos.map(g=>g.fecha));
    const dvSinG=[...new Set(M.ventas.filter(v=>!sinG.some(m=>m.mes===v.mes)).map(v=>v.fecha))].filter(d=>!diasG.has(d));
    if(dvSinG.length) out.push({t:`${dvSinG.length} días con ventas sin egreso registrado ese día`, d:'Posiblemente las compras se registran otro día. Por eso la utilidad se analiza por mes, no por día.'});
    const g0=M.gastos.filter(g=>g.valor===0);
    if(g0.length) out.push({t:`${g0.length} fila(s) de egresos con valor $0`, d:g0.map(g=>U.fdate(g.f)).join(', ')+' · excluidas del promedio de gasto diario.'});
    const atip=M.ventas.filter(v=>v.cantidad>0 && v.valor/v.cantidad>10);
    if(atip.length) out.push({t:`${atip.length} registro(s) con precio unitario atípico (> $10 por almuerzo)`, d:atip.slice(0,5).map(v=>`${v.cliente} ${U.fdate(v.f)}: ${U.money(v.valor)} / ${v.cantidad} alm.`).join(' · ')+' — revisar la cantidad.'});
    const fpAnt=M.ventas.filter(v=>v.fp && v.fp<v.f);
    if(fpAnt.length) out.push({t:`${fpAnt.length} registro(s) con fecha de pago anterior a la fecha de consumo`, d:fpAnt.slice(0,4).map(v=>`${v.cliente} (${U.fdateShort(v.f)} pagado ${U.fdateShort(v.fp)})`).join(' · ')+(fpAnt.length>4?' …':'')+' — ¿prepago o error de digitación?'});
    const pteConPago=M.ventas.filter(v=>v.pendiente && v.fp);
    if(pteConPago.length) out.push({t:`${pteConPago.length} pendiente(s) con fecha de pago registrada`, d:'Inconsistencia: marcado PTE pero con fecha de pago.'});
    const pagSinFecha=M.ventas.filter(v=>!v.pendiente && !v.fp);
    if(pagSinFecha.length) out.push({t:`${pagSinFecha.length} pagado(s) sin fecha de pago`, d:'No se pueden usar para el indicador de días de cobro.'});
    const trSinBanco=M.ventas.filter(v=>v.forma==='TRANSFERENCIA' && !v.banco);
    if(trSinBanco.length) out.push({t:`${trSinBanco.length} transferencia(s) sin banco registrado`, d:'Afecta solo a reportes por banco.'});
    const nombres=new Map(); for(const c of M.clientes.values()) nombres.set(c.nombre,(nombres.get(c.nombre)||[]).concat(c.grupo));
    const multi=[...nombres].filter(([,g])=>g.length>1);
    if(multi.length) out.push({t:`${multi.length} cliente(s) aparecen en más de un grupo`, d:multi.map(([n,g])=>`${n} (${g.join(', ')})`).join(' · ')+' — se tratan como cuentas separadas (CLIENTE + GRUPO).'});
    const dup=new Map(); for(const v of M.ventas){ const k=v.fecha+'|'+v.key; dup.set(k,(dup.get(k)||0)+1); }
    const nDup=[...dup.values()].filter(n=>n>1).length;
    if(nDup) out.push({t:`${nDup} casos de más de un registro del mismo cliente el mismo día`, d:'Parecen pedidos adicionales legítimos (ej. $3.00 + $0.50); no se eliminan.'});
    return out;
  },
  porCategoria(gastos){ if(!gastos.some(g=>g.categoria)) return null; const m=new Map(); gastos.forEach(g=>{ const k=g.categoria||'Sin categoría'; m.set(k,(m.get(k)||0)+g.valor); }); return [...m].map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v); },
  buscar(lista, q){ const t=U.norm(q).split(/\s+/).filter(Boolean); return t.length ? lista.filter(c=>t.every(x=>c.busq.includes(x))) : lista; },
  quincenas(pedidos){
    const m=new Map();
    for(const v of pedidos){ const k=v.mes+'-'+v.q; const a=m.get(k)||{k,mes:v.mes,q:v.q,total:0,n:0,estado:v.estado,vence:v.vence}; a.total+=v.valor; a.n++; m.set(k,a); }
    return [...m.values()];
  },
  tramo(c,hoy){ const d=U.dias(c.primeraPend,hoy); return CONFIG.tramosDeuda.findIndex(t=>d>=t.a&&d<=t.b); },
  ordenar(arr,k,dir,get){
    return arr.slice().sort((a,b)=>{ let x=get?get(a,k):a[k], y=get?get(b,k):b[k];
      if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
      if(x instanceof Date){x=+x;y=+y;} return (typeof x==='string'? x.localeCompare(y) : x-y)*dir; });
  },
  mensajeCobro(c){
    const pend=c.pedidos.filter(v=>v.pendiente), s=Calc.saldo(c);
    if(!pend.length) return `Hola ${c.nombre}, le saluda ${CONFIG.negocio}. Su cuenta está al día. ¡Gracias por su preferencia!`;
    const alm=U.sum(pend,v=>v.cantidad);
    return `Hola ${c.nombre} 👋\nLe saluda *${CONFIG.negocio}*.\nSu saldo pendiente es de *${U.money(s)}* por ${alm} almuerzo${alm>1?'s':''} (${pend.length} pedido${pend.length>1?'s':''}, del ${U.fdate(pend[0].f)} al ${U.fdate(pend[pend.length-1].f)}).\nLe adjunto el detalle. ¡Gracias por su preferencia!`;
  }
};
