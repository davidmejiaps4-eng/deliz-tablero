/* =========================================================
   8. TOOLTIP, TOAST, ANIMACIÓN DE NÚMEROS
   ========================================================= */
const Tip = {
  el:null, owner:null,
  show(html,x,y,owner='chart'){ const e=this.el; this.owner=owner; e.innerHTML=html; e.classList.add('on');
    const w=e.offsetWidth,h=e.offsetHeight; let L=x+14, T=y-h-12;
    if(L+w>innerWidth-8) L=x-w-14; if(L<8) L=8; if(T<8) T=y+18; e.style.left=L+'px'; e.style.top=T+'px'; },
  hide(){ this.el.classList.remove('on'); this.owner=null; }
};
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2800); }
const Anim = {
  reduce: window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches,
  contar(root){
    if(this.reduce) return;
    root.querySelectorAll('[data-count]').forEach(el=>{
      const to=+el.dataset.count, fmt=FMT[el.dataset.fmt]||U.money, t0=performance.now(), d=950;
      const step=t=>{ const p=Math.min(1,(t-t0)/d), e=1-Math.pow(1-p,3); el.textContent=fmt(to*e); if(p<1) requestAnimationFrame(step); else el.textContent=fmt(to); };
      requestAnimationFrame(step);
    });
  }
};
const cnt = (v,fmt='money') => v==null ? '—' : `<span data-count="${v}" data-fmt="${fmt}">${FMT[fmt](v)}</span>`;

/* =========================================================
   9. GRÁFICOS (SVG propio, animado e interactivo)
   ========================================================= */
const Charts = {
  reg:{},
  niceTicks(min,max,n=4){
    if(max===min){ max=min+1; }
    const raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), r=raw/mag, step=(r>5?10:r>2?5:r>1?2:1)*mag;
    const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
    for(let v=lo; v<=hi+step/2; v+=step) t.push(U.r2(v));
    return t;
  },
  barPath(x,w,yb,yv,r){
    const h=Math.abs(yb-yv); if(h<0.5) return ''; r=Math.min(r,h,w/2);
    if(yv<yb) return `M${x},${yb}V${yv+r}Q${x},${yv} ${x+r},${yv}H${x+w-r}Q${x+w},${yv} ${x+w},${yv+r}V${yb}Z`;
    return `M${x},${yb}V${yv-r}Q${x},${yv} ${x+r},${yv}H${x+w-r}Q${x+w},${yv} ${x+w},${yv-r}V${yb}Z`;
  },
  legend(id,series){
    if(series.length<2) return '';
    const h=State.hidden[id]||new Set();
    return `<div class="legend">${series.map((s,j)=>`<button class="lg ${h.has(j)?'off':''}" data-action="toggleSerie" data-c="${id}" data-s="${j}" title="Mostrar / ocultar"><i style="background:${s.color}"></i>${U.esc(s.name)}</button>`).join('')}</div>`;
  },
  redraw(id){ const r=Charts.reg[id]; if(r && document.body.contains(r.el)) Charts[r.type](r.el, r.o); },

  /* Barras agrupadas. o:{id, labels, series:[{name,color,values,negColor}], onClick, sel, tipTitle, tipExtra, nullText, height} */
  bars(el, o){
    Charts.reg[o.id]={el,o,type:'bars'};
    const hid=State.hidden[o.id]||new Set(), S=o.series.map((s,j)=>({...s,j})).filter(s=>!hid.has(s.j));
    if(!S.length){ el.innerHTML=Charts.legend(o.id,o.series)+'<div class="chart-empty">Activa al menos una serie en la leyenda.</div>'; return; }
    const W=Math.max(280, el.clientWidth||600), H=o.height||250, m={l:52,r:8,t:14,b:26};
    const pw=W-m.l-m.r, ph=H-m.t-m.b, n=o.labels.length;
    const all=S.flatMap(s=>s.values).filter(v=>v!=null);
    const ticks=Charts.niceTicks(Math.min(0,...all), Math.max(0,...all));
    const y0=ticks[0], y1=ticks[ticks.length-1], Y=v=>m.t+ph-(v-y0)/(y1-y0)*ph;
    const band=pw/n, gap=2, bw=Math.max(3,Math.min(32,(band*0.72-gap*(S.length-1))/S.length)), gw=bw*S.length+gap*(S.length-1);
    const every = band<26 ? Math.ceil(26/band) : 1;
    let defs='', g='';
    S.forEach(s=>{ defs+=`<linearGradient id="gr-${o.id}-${s.j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${s.color}"/><stop offset="1" style="stop-color:${s.color};stop-opacity:.5"/></linearGradient>`; });
    for(const t of ticks) g+=`<line class="${t===0?'axis-l':'grid-l'}" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${U.moneyShort(t)}</text>`;
    o.labels.forEach((lb,i)=>{
      const gx=m.l+band*i+(band-gw)/2, dim = o.sel!=null && o.sel!==i ? ' dim' : '';
      S.forEach((s,k)=>{ const v=s.values[i], x=gx+k*(bw+gap);
        if(v==null){ g+=`<text x="${x+bw/2}" y="${Y(0)-5}" text-anchor="middle" style="font-size:10px">s/d</text>`; return; }
        const fill = v<0 && s.negColor ? s.negColor : `url(#gr-${o.id}-${s.j})`;
        g+=`<path class="bar${v<0?' nb':''}${dim}" d="${Charts.barPath(x,bw,Y(0),Y(v),Math.min(10,bw/2))}" style="fill:${fill};animation-delay:${Math.min(i*28,500)}ms"/>`; });
      if(i%every===0) g+=`<text x="${m.l+band*i+band/2}" y="${H-8}" text-anchor="middle"${o.sel===i?' style="fill:var(--accent);font-weight:700"':''}>${U.esc(lb)}</text>`;
      g+=`<rect class="hit" data-i="${i}" x="${m.l+band*i}" y="${m.t}" width="${band}" height="${ph}" rx="6"/>`;
    });
    el.innerHTML = Charts.legend(o.id,o.series)+`<div class="chart"><svg class="${Anim.reduce?'':'anim'}" viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${U.esc(o.aria||'')}"><defs>${defs}</defs>${g}</svg></div>`;
    Charts._hover(el, i => `<div class="t">${U.esc(o.tipTitle?o.tipTitle(i):o.labels[i])}</div>`+S.map(s=>`<div class="r"><span><i style="background:${s.color}"></i>${U.esc(s.name)}</span><b>${s.values[i]==null?(o.nullText||'Sin dato'):U.money(s.values[i])}</b></div>`).join('')+(o.tipExtra?o.tipExtra(i):'')+(o.onClick?`<div class="h">${o.clickHint||'Clic para ver detalle'}</div>`:''), o.onClick);
  },

  /* Línea con área degradada. o:{id, labels, series, fmt, fmtTip, zero, onClick} */
  line(el,o){
    Charts.reg[o.id]={el,o,type:'line'};
    const W=Math.max(280, el.clientWidth||600), H=o.height||240, m={l:56,r:16,t:16,b:26};
    const pw=W-m.l-m.r, ph=H-m.t-m.b, n=o.labels.length, S=o.series;
    const all=S.flatMap(s=>s.values).filter(v=>v!=null);
    if(!all.length){ el.innerHTML='<div class="chart-empty">Sin datos para esta métrica.</div>'; return; }
    const lo=Math.min(...all), hiV=Math.max(...all);
    const ticks=Charts.niceTicks(o.zero===false ? lo-(hiV-lo)*0.15 : Math.min(0,lo), hiV);
    const y0=ticks[0], y1=ticks[ticks.length-1], Y=v=>m.t+ph-(v-y0)/(y1-y0)*ph, X=i=>m.l+(n===1?pw/2:pw*i/(n-1));
    const fmt=o.fmt||U.moneyShort, fmtTip=o.fmtTip||U.money;
    let defs='', g='';
    for(const t of ticks) g+=`<line class="grid-l" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${fmt(t)}</text>`;
    o.labels.forEach((lb,i)=>{ g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${U.esc(lb)}</text>`; });
    S.forEach((s,j)=>{
      const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean); if(!pts.length) return;
      defs+=`<linearGradient id="ga-${o.id}-${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${s.color};stop-opacity:.32"/><stop offset="1" style="stop-color:${s.color};stop-opacity:0"/></linearGradient>`;
      const d='M'+pts.map(p=>p.join(',')).join('L'), base=Y(Math.max(y0,Math.min(0,y1)));
      if(S.length===1) g+=`<path class="ar" d="${d}L${pts[pts.length-1][0]},${base}L${pts[0][0]},${base}Z" style="fill:url(#ga-${o.id}-${j})"/>`;
      g+=`<path class="ln" pathLength="1" d="${d}" fill="none" style="stroke:${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach((p,k)=>g+=`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="4.5" style="fill:var(--surface-solid);stroke:${s.color};animation-delay:${400+k*70}ms" stroke-width="2.5"/>`);
    });
    g+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" style="stroke:var(--accent)" stroke-dasharray="3 3" opacity="0"/>`;
    S.forEach((s,j)=>g+=`<circle class="hp" r="6" cx="-20" cy="-20" style="fill:${s.color};stroke:var(--surface)" stroke-width="2.5" opacity="0"/>`);
    const step=n>1?pw/(n-1):pw;
    o.labels.forEach((_,i)=>g+=`<rect class="hit" style="fill:transparent" data-i="${i}" x="${X(i)-step/2}" y="${m.t}" width="${step}" height="${ph}"/>`);
    el.innerHTML = `<div class="chart"><svg class="${Anim.reduce?'':'anim'}" viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${U.esc(o.aria||'')}"><defs>${defs}</defs>${g}</svg></div>`;
    const svg=el.querySelector('svg'), xh=svg.querySelector('.xh'), hp=[...svg.querySelectorAll('.hp')];
    Charts._hover(el, i=>{
      xh.setAttribute('x1',X(i)); xh.setAttribute('x2',X(i)); xh.setAttribute('opacity',1);
      hp.forEach((c,j)=>{ const v=S[j].values[i]; if(v==null){c.setAttribute('opacity',0);return;} c.setAttribute('cx',X(i)); c.setAttribute('cy',Y(v)); c.setAttribute('opacity',1); });
      return `<div class="t">${U.esc(o.tipTitle?o.tipTitle(i):o.labels[i])}</div>`+S.map(s=>{ const v=s.values[i], p=s.values[i-1];
        const ch = v!=null && p!=null && p!==0 ? `<div class="r"><span>vs mes anterior</span><b class="${v>=p?'up':'down'}">${v>=p?'▲':'▼'} ${U.pct(Math.abs((v-p)/p))}</b></div>` : '';
        return `<div class="r"><span><i style="background:${s.color}"></i>${U.esc(s.name)}</span><b>${v==null?'—':fmtTip(v)}</b></div>${ch}`; }).join('')+(o.onClick?'<div class="h">Clic para ver el mes</div>':'');
    }, o.onClick, ()=>{ xh.setAttribute('opacity',0); hp.forEach(c=>c.setAttribute('opacity',0)); });
  },

  _hover(el, html, onClick, onLeave){
    const svg=el.querySelector('svg');
    const at = e => { const r=e.target.closest('.hit'); return r? +r.dataset.i : null; };
    const clear = () => svg.querySelectorAll('.hit.hov').forEach(x=>x.classList.remove('hov'));
    svg.addEventListener('pointermove', e=>{ const i=at(e); if(i==null){ Tip.hide(); onLeave&&onLeave(); return; } clear(); e.target.classList.add('hov'); Tip.show(html(i),e.clientX,e.clientY); });
    svg.addEventListener('pointerleave', ()=>{ Tip.hide(); clear(); onLeave&&onLeave(); });
    if(onClick) svg.addEventListener('click', e=>{ const i=at(e); if(i!=null){ Tip.hide(); onClick(i);} });
    else svg.querySelectorAll('.hit').forEach(r=>r.style.cursor='default');
  },

  /* Mini tendencia para tarjetas KPI */
  spark(values, labels, color, fmt=U.money){
    const vals=values.map(v=>v==null?null:v), ok=vals.filter(v=>v!=null); if(ok.length<2) return '';
    const w=160,h=34,n=vals.length, mn=Math.min(...ok), mx=Math.max(...ok), X=i=>2+(w-4)*i/(n-1), Y=v=>h-3-(mx===mn?.5:(v-mn)/(mx-mn))*(h-8);
    const pts=vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean), d='M'+pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join('L');

      x.fillStyle=this.lg(x,[E.porv,'#fcd34d'],P,0,W-P,0); this.rr(x,P,by,IW,bh,bh/2); x.fill();
      x.fillStyle=this.lg(x,[E.venc,'#fb7185'],P,0,P+wv,0); this.rr(x,P,by,wv,bh,bh/2); x.fill();
      x.font=`800 18px ${F}`; x.fillStyle=E.venc; x.textAlign='left'; x.fillText(`● Vencido ${U.money(venc)} · ${U.pct(venc/pend,0)}`,P,by+bh+32);
      x.fillStyle=E.porv; x.textAlign='right'; x.fillText(`◷ Por vencer ${U.money(porv)} · ${U.pct(porv/pend,0)}`,W-P,by+bh+32);
      y+=hComp-10; }

    // ---- Detalle por quincena ----
    y+=26; const hasMark=hayPag&&hayPend;
    const geo=c=>{ const x0=P+c*(cw+gapC); return {x0,fecha:x0+22,valor:x0+cw-(hasMark?(dos?46:156):22),mark:x0+cw-(dos?18:22)}; };
    for(let c=0;c<colL.length;c++){ const g=geo(c); x.fillStyle=this.lg(x,E.th,g.x0,0,g.x0+cw,0); this.rr(x,g.x0,y,cw,hTh,hTh/2); x.fill();
      x.fillStyle=E.thText; x.font=`900 ${dos?15:16}px ${F}`; this.sp(x,2); x.textBaseline='middle';
      x.textAlign='left'; x.fillText('FECHA',g.fecha,y+hTh/2); x.textAlign='right'; x.fillText('VALOR',g.valor,y+hTh/2);
      if(hasMark&&!dos) x.fillText('ESTADO',g.mark,y+hTh/2); this.sp(x,0); }
    const y0=y+hTh+6;
    colL.forEach((col,c)=>{ const g=geo(c); let yy=y0, z=0;
      for(const l of col){
        if(l.t==='sec'){ const s=l.s, hh=l.h-12, cy=yy+6+hh/2;
          x.fillStyle=E.sec; this.rr(x,g.x0,yy+6,cw,hh,hh/2); x.fill();
          x.fillStyle=this.lg(x,E.dot,g.x0+12,0,g.x0+32,0); x.beginPath(); x.arc(g.x0+24,cy,9,0,7); x.fill();
          x.textAlign='left'; x.textBaseline='middle'; x.fillStyle=E.secText; x.font=`900 ${dos?16:18}px ${F}`; this.sp(x,.8);
          x.fillText(dos?`${s.q}ª QUINC. ${MESES_C[s.m].toUpperCase()}${l.cont?' (cont.)':''}`:`${s.q}ª QUINCENA · ${MESES[s.m].toUpperCase()} ${s.y}${l.cont?' (cont.)':''}`,g.x0+44,cy+1); this.sp(x,0);
          const pw=this.pill(x,this.estadoTxt(s.estado),g.x0+cw-10,cy,this.estadoCol(E,s.estado),'right',dos?12:13);
          if(!dos){ x.textAlign='right'; x.fillStyle=E.muted; x.font=`700 15px ${F}`; x.textBaseline='middle'; x.fillText(`vence ${U.fdateShort(s.vence)}`,g.x0+cw-22-pw,cy+1); }
          z=0;
        } else if(l.t==='row'){ const r=l.r, cy=yy+l.h/2+1;
          if(z%2===1){ x.fillStyle=E.zebra; this.rr(x,g.x0+4,yy+2,cw-8,l.h-4,(l.h-4)/2); x.fill(); } z++;
          x.textBaseline='middle'; x.fillStyle=r.pendiente?E.ink:E.muted; x.font=`600 ${fs}px ${F}`;
          x.textAlign='left'; x.fillText(U.fdate(r.f),g.fecha,cy);
          x.textAlign='right'; x.font=`800 ${fs}px ${F}`; x.fillText(U.money(r.valor),g.valor,cy);
          if(hasMark){ if(dos){ x.fillStyle=r.pendiente?E.venc:E.paid; x.beginPath(); x.arc(g.mark,cy,6,0,7); x.fill(); if(!r.pendiente){ x.fillStyle='#fff'; x.font=`900 10px ${F}`; x.textAlign='center'; x.fillText('✓',g.mark,cy+1); } }
            else this.pill(x,r.pendiente?'Pendiente':'✓ Pagado',g.mark,cy,r.pendiente?E.venc:E.paid,'right',13); }
        } else if(l.t==='sub'){ const s=l.s, cy=yy+l.h/2+2; x.textBaseline='middle';
          x.strokeStyle=E.line; x.lineWidth=1.5; x.setLineDash([4,5]); x.beginPath(); x.moveTo(g.x0+14,yy+4); x.lineTo(g.x0+cw-14,yy+4); x.stroke(); x.setLineDash([]);
          const sv=U.money(s.pend>0.004&&d.soloPendientes?s.pend:s.tot); x.textAlign='right'; x.font=`900 ${dos?21:23}px ${F}`; x.fillStyle=E.acc; x.fillText(sv,g.valor,cy);
          const sw=x.measureText(sv).width; x.font=`900 ${dos?13:14}px ${F}`; x.fillStyle=E.muted; this.sp(x,2); x.fillText('SUBTOTAL',g.valor-sw-14,cy); this.sp(x,0);
        }
        yy+=l.h;
      }
    });
    if(colL.length===2){ const sx=P+cw+gapC/2; x.strokeStyle=E.line; x.lineWidth=1.5; x.setLineDash([2,6]); x.beginPath(); x.moveTo(sx,y+hTh+10); x.lineTo(sx,y0+colH); x.stroke(); x.setLineDash([]); }
    y=y0+colH+36;

    // ---- Total ----
    const bh=hTot-30;
    x.save(); this.sombra(x,E,true); x.fillStyle=this.lg(x,E.tot,P,y,P+IW,y+bh); this.rr(x,P,y,IW,bh,34); x.fill(); x.restore();
    x.save(); this.rr(x,P,y,IW,bh,34); x.clip(); this.burbujas(x,E,P,y,IW*.6,bh,17); x.restore();
    x.textAlign='center'; x.textBaseline='alphabetic';
    x.fillStyle=E.totLbl; x.font=`900 17px ${F}`; this.sp(x,5); x.fillText(hayPend?'TOTAL A PAGAR':'CUENTA AL DÍA',W/2,y+44); this.sp(x,0);
    x.font=`900 72px ${F}`; x.fillStyle='#fff'; x.fillText(hayPend?U.money(aPagar):'✓ '+U.money(0),W/2,y+112);
    if(hayPag||abono>0.004){ const pt=[]; if(hayPag){ pt.push(`Consumo ${U.money(tot)}`); pt.push(`Pagado ${U.money(tot-pend)}`); } else pt.push(`Pedidos ${U.money(pend)}`); if(abono>0.004) pt.push(`Abonos recibidos −${U.money(abono)}`);
      x.fillStyle=E.totText; x.font=`700 19px ${F}`; x.fillText(pt.join('  ·  '),W/2,y+150); }
    y+=hTot;

    // ---- Datos de pago (tarjetas de cuentas compactas) ----
    if(hPago){
      x.save(); this.sombra(x,E,true); x.fillStyle=E.card; this.rr(x,P,y,IW,hPago,30); x.fill(); x.restore();
      x.strokeStyle=E.cardB; x.lineWidth=1.5; this.rr(x,P+.75,y+.75,IW-1.5,hPago-1.5,30); x.stroke();
      const ic=P+42, icy=y+40;
      x.fillStyle=this.lg(x,E.dot,ic-16,icy-16,ic+16,icy+16); x.beginPath(); x.arc(ic,icy,16,0,7); x.fill();
      x.strokeStyle='#fff'; x.lineWidth=2.2; this.rr(x,ic-9,icy-6.5,18,13,3); x.stroke(); x.beginPath(); x.moveTo(ic-9,icy-1.5); x.lineTo(ic+9,icy-1.5); x.stroke();
      x.textAlign='left'; x.textBaseline='middle'; x.fillStyle=E.acc; x.font=`900 15px ${F}`; this.sp(x,3); x.fillText('DATOS PARA SU PAGO',ic+28,icy+1); this.sp(x,0);
      if(PG.titular){ x.font=`800 15px ${F}`; const tt=this.fit(x,'Titular: '+PG.titular,IW*.5); const tw=x.measureText(tt).width+30;
        x.fillStyle=E.sec; this.rr(x,W-P-24-tw,icy-17,tw,34,17); x.fill(); x.fillStyle=E.secText; x.textAlign='center'; x.fillText(tt,W-P-24-tw/2,icy+1); }
      const gx=P+24, gw=IW-48, tw2=(gw-T_G*(pCols-1))/pCols; let ty=y+70;
      PG.cuentas.forEach((c,i)=>{ const col=i%pCols, row=Math.floor(i/pCols), tx=gx+col*(tw2+T_G), yy=ty+row*(T_H+T_G);
        x.fillStyle=E.sec; this.rr(x,tx,yy,tw2,T_H,22); x.fill();
        const av=tx+38, avy=yy+T_H/2, bc=this.colorBanco(c.banco);
        x.fillStyle=bc?bc.bg:this.lg(x,E.dot,av-24,avy-24,av+24,avy+24); x.beginPath(); x.arc(av,avy,24,0,7); x.fill();
        x.fillStyle=bc?bc.fg:'#fff'; x.font=`900 20px ${F}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(this.inicial(c.banco),av,avy+1);
        const lx=tx+76, lw=tw2-90; x.textAlign='left'; x.textBaseline='alphabetic';
        x.fillStyle=E.ink; x.font=`900 17px ${F}`; x.fillText(this.fit(x,c.banco||'Cuenta',lw),lx,yy+30);
        x.fillStyle=E.muted; x.font=`800 12px ${F}`; this.sp(x,1.2); x.fillText(this.fit(x,(c.tipo||'').toUpperCase(),lw),lx,yy+50); this.sp(x,0);
        x.fillStyle=E.acc; x.font=`900 ${pCols===3?21:23}px ${F}`; this.sp(x,.8); x.fillText(this.fit(x,c.numero||'',lw),lx,yy+78); this.sp(x,0);
        if(c.titular){ x.fillStyle=E.muted; x.font=`700 12px ${F}`; x.textAlign='right'; x.fillText(this.fit(x,c.titular,lw*.6),tx+tw2-14,yy+30); }
      });
      let ny=ty+(nC?pRows*T_H+(pRows-1)*T_G:0)+(nC?30:6);
      x.textAlign='left'; x.textBaseline='alphabetic'; x.fillStyle=E.ink2; x.font=`700 16px ${F}`;
      PG.notas.forEach(n=>{ x.fillText(this.fit(x,n,gw),gx+4,ny); ny+=28; });
      y+=hPago+26; }

    // ---- Cierre ----
    x.textAlign='center'; x.textBaseline='alphabetic'; x.fillStyle=E.ink; x.font=`italic 800 23px ${F}`; x.fillText(this.fit(x,d.cierre||'¡Gracias por su preferencia!',IW),W/2,y+40);
    if(hasMark){ x.fillStyle=E.muted; x.font=`600 15px ${F}`; x.fillText('● pendiente  ·  ✓ pagado',W/2,y+72); }
    const mime=d.formato==='png'?'image/png':'image/jpeg', bin=atob(cv.toDataURL(mime,0.92).split(',')[1]), u8=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k); cv.width=cv.height=1;
    return new Blob([u8],{type:mime});
  }
};

        ${(()=>{ const cats=Calc.porCategoria(Mf.gastos); return cats ? `<div class="card"><h3>Gastos por categoría</h3><p class="sub">Peso de cada categoría en el total de egresos</p>${Charts.hbars(cats.map(c=>({l:c.c,v:c.v,s:U.pct(c.v/K.gastos,0),color:'var(--c-gastos)'})))}</div>` : ''; })()}
        <div class="card"><h3>Forma de pago</h3><p class="sub">Valor por forma registrada</p>${(()=>{const m=new Map();for(const x of Mf.ventas){const k=x.pendiente?'Pendiente (PTE)':x.forma;m.set(k,(m.get(k)||0)+x.valor);}return Charts.hbars([...m].map(([l,val])=>({l:U.cap(l),v:val,s:U.pct(val/K.ventas,0),color:l.startsWith('Pend')?'var(--c-neg)':'',act:l.startsWith('Pend')?'data-action="nav" data-v="cobros"':''})).sort((a,b)=>b.v-a.v));})()}</div>
        <div class="card" data-list><h3>Top 10 clientes</h3><p class="sub">Clic para abrir el detalle del cliente</p>${Charts.hbars([...Mf.clientes.values()].sort((a,b)=>b.total-a.total).slice(0,10).map(c=>({l:c.nombre,v:c.total,s:U.pct(c.total/K.ventas,1),act:`data-action="cliente" data-k="${U.esc(c.key)}"`,tip:`<div class="r"><span>Grupo</span><b>${U.esc(c.grupo)}</b></div><div class="r"><span>Almuerzos</span><b>${c.almuerzos}</b></div>`})))}</div>
      </div>

      <div class="section-title">Calidad de datos <small>Revisiones automáticas sobre toda la base</small></div>
      <div class="card"><div class="dq">${Calc.calidad(M,State.mensual).map(q=>`<div class="dq-row"><span class="ic">!</span><div>${U.esc(q.t)}<small>${U.esc(q.d)}</small></div></div>`).join('')||'<div class="muted">Sin observaciones.</div>'}</div></div>`;
    const go=i=>Nav.ir('mes/'+MS[i].mes);
    Charts.bars(document.getElementById('chVG'),{id:'vg',labels:lab,aria:'Ventas vs gastos por mes',onClick:go,tipTitle:i=>labL[i],nullText:'Sin egresos',
      series:[{name:'Ventas',color:'var(--c-ventas)',values:MS.map(m=>m.ventas)},{name:'Gastos',color:'var(--c-gastos)',values:MS.map(m=>m.gastos)}],
      tipExtra:i=>MS[i].utilidad==null?'':`<div class="r"><span>Utilidad</span><b>${U.money(MS[i].utilidad)}</b></div>`});
    Charts.bars(document.getElementById('chU'),{id:'ut',labels:lab,aria:'Utilidad mensual',onClick:go,tipTitle:i=>labL[i],nullText:'Sin egresos',

      tipExtra:i=>`<div class="r"><span>Margen</span><b>${U.pct(MS[i].margen)}</b></div>`});

  evolucion(MS){

      series:[{name:mt.l,color:mt.color,values:MS.map(mt.f)}]});
  },
  tblMensual(MS,K){

      <tfoot><tr><td>Total</td><td class="r num">${U.money(K.ventas)}</td><td></td><td class="r num">${U.money(K.gastos)}</td><td class="r num">${K.comp.length?U.money(K.utilidad)+'*':'—'}</td><td class="r num">${K.margen==null?'—':U.pct(K.margen)+'*'}</td><td class="r num">${U.int(K.almuerzos)}</td><td class="r num">${Calc.subModelo(State.M,State.periodo.desde,State.periodo.hasta).clientes.size}</td><td class="r num">${U.money(K.ventaDiaria)}</td><td class="r num">${U.money(K.pendiente)}</td><td></td></tr></tfoot></table></div>
      <p class="sub" style="margin:10px 0 0">* Utilidad y margen totales solo sobre meses con egresos. Clientes total = cuentas únicas (cliente + grupo).</p>`;
  },

    v.innerHTML = `

        <div class="mes-nav">${prev?`<button class="btn" data-action="mes" data-m="${prev.mes}">${I.back}${U.mesLabel(prev.mes,1)}</button>`:''}${next?`<button class="btn" data-action="mes" data-m="${next.mes}">${U.mesLabel(next.mes,1)}${I.next}</button>`:''}</div></div>
      <div class="grid g-4">
        ${kpi('<i class="dot" style="background:var(--c-ventas)"></i>Ventas',cnt(m.ventas),m.crec==null?'':`${trend(m.crec)} vs mes anterior`,'lux gx gv')}
        ${kpi('<i class="dot" style="background:var(--c-gastos)"></i>Gastos',m.gastos==null?'<span class="na">No registrado</span>':cnt(m.gastos),m.gastos==null?'':`${m.diasGasto} días con egresos`,'lux gx gg')}
        ${kpi('<i class="dot" style="background:var(--c-util)"></i>Utilidad',m.utilidad==null?'<span class="na">No calculable</span>':`<span class="${m.utilidad<0?'neg':''}">${cnt(m.utilidad)}</span>`,'','lux gx gu')}
        ${kpi('Margen',m.margen==null?'<span class="na">No calculable</span>':`<span class="gold">${cnt(m.margen,'pct')}</span>`,'','lux gx gm')}
        ${kpi('Almuerzos vendidos',cnt(m.almuerzos,'int'),`${U.dec1(m.almuerzos/m.diasVenta)} por día`,'sm')}
        ${kpi('Clientes atendidos',cnt(m.clientes,'int'),'Cuentas distintas (cliente + grupo)','sm')}
        ${kpi('Promedio diario',cnt(m.promDiario),'Venta ÷ días con ventas','sm')}
        ${kpi('Pendiente del mes',`<span style="color:${m.pendiente?'var(--crit)':'inherit'}">${cnt(m.pendiente)}</span>`,`${ventas.filter(x=>x.pendiente).length} pedidos PTE`,'sm'+(m.pendiente?' click':''),m.pendiente?'data-action="mesPend"':'')}
      </div>
      <div class="card mt"><h3>Ventas y gastos por día</h3><p class="sub">Clic en un día para filtrar la tabla de ventas</p><div id="chD"></div></div>
      <div class="grid g-2 mt">
        <div class="card"><h3>Ventas por grupo</h3><p class="sub">Clic en un grupo para filtrar la tabla</p>${Charts.hbars(Calc.porGrupo(ventas).map(g=>({l:g.grupo,v:g.ventas,s:g.pend?'PTE '+U.money(g.pend):'',act:`data-action="mesGrupo" data-g="${U.esc(g.grupo)}"`,tip:`<div class="r"><span>Clientes</span><b>${g.cli.size}</b></div>`})))}</div>
        <div class="card"><h3>Gastos del mes</h3><p class="sub">${gastos.some(g=>g.categoria||g.concepto)?'Detalle registrado en la base':'Concepto y categoría no existen en la base (solo total diario)'}</p>
          ${gastos.length?`<div class="tbl-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th class="r">Valor</th></tr></thead><tbody>${gastos.map(g=>`<tr><td>${U.fdate(g.f)}</td><td class="${g.concepto?'':'muted'}">${g.concepto?U.esc(g.concepto):'Total egresos del día'}</td><td class="${g.categoria?'':'muted'}">${g.categoria?U.esc(g.categoria):'No registrada'}</td><td class="r num">${U.money(g.valor)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total</td><td class="r num">${U.money(m.gastos)}</td></tr></tfoot></table></div>`:'<div class="empty">No hay egresos registrados para este mes.</div>'}
        </div>
      </div>
      <div class="card mt" id="cardVentas"><h3>Ventas del mes</h3>
        <div class="toolbar"><div class="search">${I.search}<input data-input="mesQ" placeholder="Filtrar por cliente o grupo…" value="${U.esc(State.mesDet.q)}"></div>
          <select class="sel" data-change="mesEstado"><option value="todos">Todos los estados</option><option value="pagado">Pagado</option><option value="pendiente">Pendiente</option></select><span id="diaChip"></span></div>
        <div id="mesTabla" data-list></div></div>`;
    v.querySelector('[data-change="mesEstado"]').value=State.mesDet.estado;
    Views.mesDias(); Views.mesTabla();
  },
  mesDias(){
    const k=State.mes, [y,mm]=k.split('-').map(Number), nd=new Date(y,mm,0).getDate();
    const ventas=State.M.ventas.filter(x=>x.mes===k), gastos=State.M.gastos.filter(x=>x.mes===k);
    const dv=Array(nd).fill(0), dg=Array(nd).fill(null), dp=Array(nd).fill(0);
    ventas.forEach(x=>{ dv[x.f.getDate()-1]+=x.valor; dp[x.f.getDate()-1]++; }); gastos.forEach(x=>dg[x.f.getDate()-1]=(dg[x.f.getDate()-1]||0)+x.valor);
    const last=Math.max(...ventas.map(x=>x.f.getDate()), ...gastos.filter(g=>g.valor>0).map(g=>g.f.getDate()), 1);
    Charts.bars(document.getElementById('chD'),{id:'dia',labels:Array.from({length:last},(_,d)=>String(d+1)),aria:'Ventas y gastos diarios',height:230,
      sel: State.mesDet.dia!=null ? State.mesDet.dia-1 : null, clickHint:'Clic para filtrar la tabla',
      tipTitle:d=>`${DIAS[new Date(y,mm-1,d+1).getDay()]} ${d+1}/${mm}`, nullText:'Sin registro',
      tipExtra:d=>`<div class="r"><span>Pedidos</span><b>${dp[d]}</b></div>`,
      onClick:d=>{ State.mesDet.dia = State.mesDet.dia===d+1 ? null : d+1; State.mesDet.limite=CONFIG.filasPorPagina; Views.mesDias(); Views.mesTabla(); if(State.mesDet.dia) document.getElementById('cardVentas').scrollIntoView({behavior:'smooth',block:'start'}); },
      series:[{name:'Ventas',color:'var(--c-ventas)',values:dv.slice(0,last).map(x=>x?U.r2(x):0)},{name:'Gastos',color:'var(--c-gastos)',values:dg.slice(0,last)}]});
  },
  mesTabla(){
    const k=State.mes, f=State.mesDet, [y,mm]=k.split('-').map(Number); let rows=State.M.ventas.filter(x=>x.mes===k);
    const t=U.norm(f.q).split(/\s+/).filter(Boolean);
    if(t.length) rows=rows.filter(r=>{const s=U.norm(r.cliente+' '+r.grupo); return t.every(x=>s.includes(x));});
    if(f.estado==='pagado') rows=rows.filter(r=>!r.pendiente); else if(f.estado==='pendiente') rows=rows.filter(r=>r.pendiente);
    if(f.dia) rows=rows.filter(r=>r.f.getDate()===f.dia);
    const s=State.sort.mesVentas; rows=Calc.ordenar(rows,s.k,s.dir);
    document.getElementById('diaChip').innerHTML = f.dia ? `<span class="fchip">Día ${f.dia}/${mm}<button data-action="quitarDia" aria-label="Quitar filtro">×</button></span>` : '';
    const vis=rows.slice(0,f.limite);
    document.getElementById('mesTabla').innerHTML = rows.length ? `
      <div class="tbl-wrap"><table><thead><tr>${thS('mesVentas','f','Fecha','',1)}${thS('mesVentas','cliente','Cliente','',1)}${thS('mesVentas','grupo','Grupo','',1)}${thS('mesVentas','cantidad','Almuerzos','c')}${thS('mesVentas','valor','Valor','r')}${thS('mesVentas','estado','Estado','',1)}${thS('mesVentas','forma','Forma','',1)}${thS('mesVentas','fp','Fecha pago','',1)}</tr></thead>
      <tbody>${vis.map(r=>`<tr class="link" data-action="cliente" data-k="${U.esc(r.key)}"><td>${U.fdate(r.f)}</td><td><b>${U.esc(r.cliente)}</b></td><td><span class="chip-g">${U.esc(r.grupo)}</span></td><td class="c num">${r.cantidad}</td><td class="r num">${U.money(r.valor)}</td><td>${badge(r.estado)}</td><td class="muted">${r.pendiente?'—':U.esc(U.cap(r.forma))}</td><td class="muted">${r.fp?U.fdate(r.fp):'—'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">${rows.length} registros</td><td class="c num">${U.sum(rows,r=>r.cantidad)}</td><td class="r num">${U.money(U.sum(rows,r=>r.valor))}</td><td colspan="3"></td></tr></tfoot></table></div>
      ${rows.length>vis.length?`<div style="text-align:center;margin-top:12px"><button class="btn" data-action="masFilas">Mostrar más (${rows.length-vis.length} restantes)</button></div>`:''}`
      : '<div class="empty">Sin resultados.</div>';
  },

  /* ---------------- COBROS ---------------- */
  cobros(){
    const {M,K}=State, c=State.cobros, hoy=M.hoy;
    const deud=[...M.clientes.values()].filter(x=>Calc.saldo(x)>0.004);
    const grp=new Map(); deud.forEach(d=>{const g=grp.get(d.grupo)||{g:d.grupo,t:0,n:0}; g.t+=Calc.saldo(d); g.n++; grp.set(d.grupo,g);});
    const gs=[...grp.values()].sort((a,b)=>b.t-a.t);
    const tr=CONFIG.tramosDeuda.map(t=>({...t,v:0,n:0})); deud.forEach(d=>{const i=Calc.tramo(d,hoy); if(i>=0){tr[i].v+=Calc.saldo(d); tr[i].n++;}});
    const tcol=['var(--c-ventas)','var(--warn)','var(--c-gastos)','var(--crit)'];
    const v=document.getElementById('view');
    v.innerHTML=`
      <div class="page-head"><div><div class="eyebrow">Gestión de cartera</div><h1>Cobros pendientes</h1><p>Pendiente = pedidos con FORMA "PTE". Vence: 1ª quincena el día 15, 2ª quincena el fin de mes · Corte ${U.fdate(hoy)}</p></div></div>
      <div class="grid g-kpi">
        ${kpi('Total pendiente',`<span style="color:var(--crit)">${cnt(K.pendiente)}</span>`,'','lux gx gc')}
        ${kpi('Clientes con deuda',cnt(K.deudores,'int'),'','lux gx gv')}
        ${kpi('Pedidos pendientes',cnt(K.pedidosPend,'int'),'','lux gx gm')}
        ${kpi('Promedio por cliente',cnt(K.deudores?K.pendiente/K.deudores:0),'','lux gx gu')}
        ${kpi('● Vencido',cnt(K.vencido),'Quincenas ya cerradas','sm click','data-action="cobEstadoQ" data-e="vencido"')}
        ${kpi('◷ Por vencer',cnt(K.porVencer),'Quincena en curso','sm click','data-action="cobEstadoQ" data-e="porvencer"')}
      </div>
      <div class="section-title">Antigüedad de la deuda <small>Según el pedido pendiente más antiguo · clic para filtrar</small></div>
      <div class="aging">${tr.map((t,i)=>`<button class="ag ${c.tramo===i?'on':''}" data-action="tramo" data-i="${i}"><div class="t">${t.l}</div><div class="v num">${U.money(t.v)}</div><div class="s">${t.n} cliente${t.n!==1?'s':''} · ${U.pct(K.pendiente?t.v/K.pendiente:0,0)}</div><div class="bar"><i style="width:${K.pendiente?(t.v/K.pendiente*100).toFixed(1):0}%;background:${tcol[i]}"></i></div></button>`).join('')}</div>
      <div class="section-title">Grupos con pendientes</div>
      <div class="chips">
        <button class="chip ${c.grupo==='TODOS'?'on':''}" data-action="grupoCob" data-g="TODOS"><b>TODOS</b><span class="num">${U.money(K.pendiente)}</span><small>${K.deudores} clientes</small><div class="mini"><i style="width:100%"></i></div></button>
        ${gs.map(g=>`<button class="chip ${c.grupo===g.g?'on':''}" data-action="grupoCob" data-g="${U.esc(g.g)}"><b>${U.esc(g.g)}</b><span class="num">${U.money(g.t)}</span><small>${g.n} cliente${g.n>1?'s':''}</small><div class="mini"><i style="width:${(g.t/K.pendiente*100).toFixed(1)}%"></i></div></button>`).join('')}
      </div>
      <div class="toolbar">
        <div class="search">${I.search}<input data-input="cobQ" placeholder="Buscar por nombre, apellido o grupo…" value="${U.esc(c.q)}" autocomplete="off"><kbd>/</kbd></div>
        <select class="sel" data-change="cobEstado"><option value="todos">Todos los estados</option><option value="vencido">Con saldo vencido</option><option value="porvencer">Solo por vencer</option></select>
        <select class="sel" data-change="cobOrden"><option value="monto">Mayor deuda</option><option value="antig">Más antigua</option><option value="nombre">Nombre A–Z</option><option value="pedidos">Más pedidos</option></select>
        <button class="btn primary" data-action="zipFiltrados" id="btnZipF">⬇ Imágenes</button>
      </div>
      <div id="cobFiltros" style="margin:-4px 0 10px"></div>
      <div class="card" style="padding:6px 16px"><div id="cobLista" data-list></div></div>`;
    v.querySelector('[data-change="cobOrden"]').value=c.orden; v.querySelector('[data-change="cobEstado"]').value=c.estado;
    Views.cobLista();
  },
  cobLista(){
    const c=State.cobros, hoy=State.M.hoy; let L=[...State.M.clientes.values()].filter(x=>Calc.saldo(x)>0.004);
    if(c.grupo!=='TODOS') L=L.filter(x=>x.grupo===c.grupo);
    if(c.estado==='vencido') L=L.filter(x=>x.vencido>0.004); else if(c.estado==='porvencer') L=L.filter(x=>x.vencido<0.004);

/* ---------------- MODAL DE IMAGEN (individual) ---------------- */
const ModalImg = {
  async generar(){
    const c=State.M.clientes.get(State.drawer.key); let {filas,label,solo}=Drawer.filas();

    if(State.drawer.periodo==='pend') label=ImgCfg.labelPend(c);

    const blob=await ImageGen.generar(ImgCfg.datos(c,filas,label,solo));

    if(State.img.url) URL.revokeObjectURL(State.img.url);
    const nombre=`estado_cuenta_${Lote.limpio(c.nombre)}_${U.iso(new Date())}.${ImgCfg.ext()}`;
    State.img={...State.img,blob,url:URL.createObjectURL(blob),nombre};
    const file=new File([blob],nombre,{type:ImgCfg.mime()});

    document.getElementById('modalBox').innerHTML=`
      <div class="dr-head"><div style="flex:1;min-width:0"><h2 style="font-size:20px">Estado de cuenta</h2><div class="muted" style="font-size:12px">${U.esc(c.nombre)} · ${filas.length} pedidos · ${filas.length>CONFIG.umbralDobleColumna?'dos columnas':'una columna'}</div></div>
        ${ImgCfg.segEstilos('estiloImg')}
        <button class="btn ghost" data-action="cerrarModal">${I.x}</button></div>
      <div class="modal-body"><img src="${State.img.url}" alt="Estado de cuenta de ${U.esc(c.nombre)}">${ImgCfg.campos()}</div>

/* PDF mínimo sin librerías: cada página es una imagen JPEG de alta resolución (A4 horizontal) */
const PDF = {
  async crear(canvases, pw=842, ph=595){
    const te=new TextEncoder(), partes=[], offs=[]; let pos=0;
    const add=x=>{ const b=typeof x==='string'?te.encode(x):x; partes.push(b); pos+=b.length; };
    const obj=(n,body)=>{ offs[n]=pos; add(`${n} 0 obj\n`); body(); add('\nendobj\n'); };
    add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const n=canvases.length, kids=[];
    for(let i=0;i<n;i++) kids.push(`${3+i*3} 0 R`);
    obj(1,()=>add('<</Type/Catalog/Pages 2 0 R>>'));
    obj(2,()=>add(`<</Type/Pages/Kids[${kids.join(' ')}]/Count ${n}>>`));
    for(let i=0;i<n;i++){
      const cv=canvases[i], pg=3+i*3, im=pg+1, ct=pg+2;
      const iw=cv.width, ih=cv.height, b64=cv.toDataURL('image/jpeg',0.9).split(',')[1], bin=atob(b64), jpg=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) jpg[k]=bin.charCodeAt(k);
      cv.width=cv.height=1; await new Promise(r=>setTimeout(r,0));
      const phI=Math.round(pw*ih/iw), cs=`q ${pw} 0 0 ${phI} 0 0 cm /Im0 Do Q`;
      obj(pg,()=>add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${phI}]/Resources<</XObject<</Im0 ${im} 0 R>>>>/Contents ${ct} 0 R>>`));
      obj(im,()=>{ add(`<</Type/XObject/Subtype/Image/Width ${iw}/Height ${ih}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`); add(jpg); add('\nendstream'); });
      obj(ct,()=>add(`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`));
    }
    const total=3+n*3, xref=pos;
    let x=`xref\n0 ${total}\n0000000000 65535 f \n`; for(let i=1;i<total;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
    add(x+`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(partes,{type:'application/pdf'});
  }
};

    x.fillStyle=lg(x,['#e8eeff','#f1ecff'],X0,0,X0+tabW,0); rr(x,X0,y,tabW,TH,TH/2); x.fill();
    x.fillStyle='#3730a3'; x.textAlign='left'; x.textBaseline='middle'; x.font=`900 23px ${F}`; x.fillText('CLIENTE',X0+32,y+TH/2);

    dias.forEach((d,k)=>{ const f=U.parse(d), cx=X0+nameW+cw*k+cw/2; x.textAlign='center'; x.fillStyle='#6366f1'; x.font=`800 ${fsH-2}px ${F}`; x.fillText(DIAS[f.getDay()].slice(0,3).toUpperCase(),cx,y+28); x.fillStyle='#1e1b4b'; x.font=`900 ${fsH}px ${F}`; x.fillText(U.fdateShort(f),cx,y+58); });
    x.textAlign='center'; x.fillStyle='#3730a3'; x.font=`900 21px ${F}`; x.fillText('DÍAS',X0+nameW+cw*dias.length+totW/2,y+TH/2);
    y+=TH+8;
    const bodyH=nF*RH+nG*GH;

    let z=0;
    for(const it of items){
      if(it.t==='g'){ const h=GH; x.fillStyle='#eef3ff'; rr(x,X0,y+2,tabW,h-4,(h-4)/2); x.fill(); x.fillStyle=lg(x,['#3b82f6','#8b5cf6'],X0+14,0,X0+34,0); x.beginPath(); x.arc(X0+24,y+h/2,Math.min(8,h*.22),0,7); x.fill();
        x.textAlign='left'; x.fillStyle='#1e3a8a'; x.font=`900 ${Math.max(10,fsN*0.9)}px ${F}`; x.fillText(it.g,X0+42,y+h/2+1); y+=h; z=0; continue; }
      const f=it.f, cy=y+RH/2+1;
      if(z%2===1){ x.fillStyle='#ffffff'; rr(x,X0,y+1,tabW,RH-2,(RH-2)/2); x.fill(); } z++;
      x.textAlign='left'; x.fillStyle='#0f172a'; x.font=`800 ${fsN}px ${F}`; x.fillText(IG.fit(x,f.nombre,nameW-44),X0+32,cy);
      dias.forEach((d,k)=>{ const cx=X0+nameW+cw*k+cw/2;
        if(f.set.has(d)){ const pw=Math.min(cw-10,72), ph=Math.max(10,Math.min(34,RH-8)); x.fillStyle=lg(x,['#10b981','#059669'],0,cy-ph/2,0,cy+ph/2); rr(x,cx-pw/2,cy-ph/2,pw,ph,ph/2); x.fill(); x.fillStyle='#fff'; x.font=`900 ${fsC}px ${F}`; x.textAlign='center'; x.fillText('SI',cx,cy+1); }
        else { x.fillStyle='#c3cadb'; x.font=`800 ${fsC*0.95}px ${F}`; x.textAlign='center'; x.fillText('NO',cx,cy+1); } });
      x.textAlign='center'; x.fillStyle='#4f46e5'; x.font=`900 ${Math.max(10,fsN*1.05)}px ${F}`; x.fillText(String(f.n),X0+nameW+cw*dias.length+totW/2,cy);
      y+=RH;
    }
    // Totales por día
    y+=8; x.fillStyle=lg(x,['#0b1b4d','#1f4fd8','#7c5cfc'],X0,0,X0+tabW,0); rr(x,X0,y,tabW,TR,TR/2); x.fill();
    const cy=y+TR/2+1; x.textAlign='left'; x.fillStyle='#fff'; x.font=`900 ${Math.max(10,Math.min(23,fsN))}px ${F}`; x.fillText('TOTAL POR DÍA',X0+32,cy);
    dias.forEach((d,k)=>{ x.textAlign='center'; x.font=`900 ${Math.max(9,Math.min(22,fsC*1.1))}px ${F}`; x.fillText(String(D.porDia[d]),X0+nameW+cw*k+cw/2,cy); });
    x.font=`900 ${Math.max(10,Math.min(23,fsN))}px ${F}`; x.fillText(String(D.si),X0+nameW+cw*dias.length+totW/2,cy);
    // Pie
    x.textBaseline='alphabetic'; x.textAlign='left'; x.fillStyle='#8391aa'; x.font=`700 19px ${F}`;
    x.fillText('SI = realizó pedido ese día  ·  NO = no realizó pedido',P,H-32);
    x.textAlign='right'; x.fillText('Generado el '+U.fdate(new Date()),W-P,H-32);
    const blob=await PDF.crear([cv]);
    try{ localStorage.setItem('deliz-rep',JSON.stringify({grupo:R.grupo})); }catch(e){}
    Lote.bajar(blob,`reporte_pedidos_${R.grupo==='TODOS'?'todos':Lote.limpio(R.grupo)}_${R.desde}_a_${R.hasta}.pdf`);
    if(btn){ btn.disabled=false; btn.textContent='⬇ Descargar PDF'; }
    toast('PDF generado en una hoja.');
  }
};

/* =========================================================
   TESORERÍA — saldos por cuenta (banco + titular) y caja
   · Cobros de la hoja (FORMA/BANCO/DESTINATARIO) suman solos desde el corte.
   · Egresos de la hoja BD Egresos se descuentan de la caja desde el corte.
   · Movimientos manuales: ingreso, egreso, transferencia (incluye retiro a caja).
   Estado guardado en este navegador (localStorage) con respaldo JSON.
   Estructura lista para migrar a hojas de Excel / backend:
     { corte:'YYYY-MM-DD', iniciales:{cuenta:valor}, extras:[{k}], movs:[{id,fecha,tipo,cuenta,destino,valor,concepto,creado}] }
   ========================================================= */
const Tes = {
  KEY:'deliz-tesoreria', st:null, filtro:{cuenta:'TODAS', mes:'TODOS', origen:'todos', todas:false}, borrar:null,
  BANCOS:{GYE:'Banco Guayaquil',GUAYAQUIL:'Banco Guayaquil',PICHINCHA:'Banco Pichincha',INTERNACIONAL:'Banco Internacional',BOLIVARIANO:'Banco Bolivariano',PRODUBANCO:'Produbanco',PACIFICO:'Banco del Pacífico','SIN BANCO':'Transferencia sin banco'},
  cargar(){ try{ this.st=JSON.parse(localStorage.getItem(this.KEY)||'null'); }catch(e){ this.st=null; }
    if(!this.st||typeof this.st!=='object') this.st={corte:null,iniciales:{},extras:[],movs:[]};
    this.st.iniciales=this.st.iniciales||{}; this.st.extras=this.st.extras||[]; this.st.movs=this.st.movs||[]; },
  guardar(){ try{ localStorage.setItem(this.KEY,JSON.stringify(this.st)); }catch(e){} Sync.cambio(); return true; },
  keyVenta(v){ if(v.forma==='EFECTIVO'||v.banco==='EFECTIVO') return 'CAJA'; return (v.banco||'SIN BANCO')+'|'+(v.destinatario||'SIN TITULAR'); },
  info(k){ if(k==='CAJA') return {k,banco:'Caja',titular:'Efectivo',nombre:'Caja (efectivo)',caja:true};
    const [b,t]=k.split('|'), bn=this.BANCOS[b]||U.cap(b), tn=t==='SIN TITULAR'?'Sin titular':U.cap(t); return {k,banco:bn,titular:tn,nombre:`${bn} · ${tn}`}; },
  cuentas(){
    const s=new Set(['CAJA']); State.M.ventas.forEach(v=>{ if(!v.pendiente) s.add(this.keyVenta(v)); });
    this.st.extras.forEach(e=>s.add(e.k)); Object.keys(this.st.iniciales).forEach(k=>s.add(k));
    return [...s].map(k=>this.info(k)).sort((a,b)=>(b.caja?1:0)-(a.caja?1:0)||a.nombre.localeCompare(b.nombre));
  },
  fechaCobro(v){ return v.fp||v.f; },
  /* Libro de movimientos: automáticos (agrupados por día y cuenta) + manuales */
  movimientos(){
    const c=this.st.corte, out=[]; if(!c) return out;
    const g=new Map();
    for(const v of State.M.ventas){ if(v.pendiente) continue; const f=U.iso(this.fechaCobro(v)); if(f<=c) continue;
      const k=f+'#'+this.keyVenta(v); const a=g.get(k)||{fecha:f,cuenta:this.keyVenta(v),tipo:'cobro',entrada:0,salida:0,n:0,auto:true}; a.entrada+=v.valor; a.n++; g.set(k,a); }
    g.forEach(a=>{ a.entrada=U.r2(a.entrada); a.concepto=`Cobros de clientes (${a.n})`; out.push(a); });
    for(const e of State.M.gastos){ if(e.fecha<=c||!(e.valor>0)) continue; out.push({fecha:e.fecha,cuenta:'CAJA',tipo:'gasto',entrada:0,salida:e.valor,concepto:e.concepto||(e.categoria?`Egreso · ${e.categoria}`:'Egresos del día (BD Egresos)'),auto:true}); }
    for(const m of this.st.movs){ if(m.fecha<=c) continue;
      if(m.tipo==='ingreso') out.push({id:m.id,fecha:m.fecha,cuenta:m.cuenta,tipo:'ingreso',entrada:m.valor,salida:0,concepto:m.concepto||'Ingreso'});
      else if(m.tipo==='egreso') out.push({id:m.id,fecha:m.fecha,cuenta:m.cuenta,tipo:'egreso',entrada:0,salida:m.valor,concepto:m.concepto||'Egreso'});
      else { const d=this.info(m.destino).nombre, o=this.info(m.cuenta).nombre;
        out.push({id:m.id,fecha:m.fecha,cuenta:m.cuenta,tipo:'transfer',entrada:0,salida:m.valor,concepto:(m.concepto||'Transferencia')+' → '+d});
        out.push({id:m.id,fecha:m.fecha,cuenta:m.destino,tipo:'transfer',entrada:m.valor,salida:0,concepto:(m.concepto||'Transferencia')+' ← '+o}); } }
    return out.sort((a,b)=>b.fecha.localeCompare(a.fecha)||(a.auto?1:0)-(b.auto?1:0));
  },
  saldos(movs){
    const S=new Map(this.cuentas().map(c=>[c.k,{...c,inicial:+this.st.iniciales[c.k]||0,entradas:0,salidas:0,cobros:0,gastos:0}]));
    for(const m of movs){ const s=S.get(m.cuenta)||S.set(m.cuenta,{...this.info(m.cuenta),inicial:0,entradas:0,salidas:0,cobros:0,gastos:0}).get(m.cuenta);
      s.entradas+=m.entrada; s.salidas+=m.salida; if(m.tipo==='cobro') s.cobros+=m.entrada; if(m.tipo==='gasto'||m.tipo==='egreso') s.gastos+=m.salida; }
    S.forEach(s=>s.saldo=U.r2(s.inicial+s.entradas-s.salidas));
    return [...S.values()];
  },
  historico(){ const h=new Map(); for(const v of State.M.ventas){ if(v.pendiente) continue; const k=this.keyVenta(v); h.set(k,(h.get(k)||0)+v.valor); } return h; },
  avatar(c,size=46){
    if(c.caja) return `<span class="acc-av" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,#0ea5a4,#14b8a6)">💵</span>`;
    const col=ImageGen.colorBanco(c.banco); const ini=ImageGen.inicial(c.banco);
    return `<span class="acc-av" style="width:${size}px;height:${size}px;${col?`background:${col.bg};color:${col.fg}`:'background:var(--grad);color:#fff'}">${U.esc(ini)}</span>`;
  },

  /* ---------------- VISTA ---------------- */
  vista(){
    this.cargar(); const v=document.getElementById('view'), c=this.st.corte;
    if(!c){
      const H=this.historico(), cs=this.cuentas();
      v.innerHTML=`
        <div class="page-head"><div><div class="eyebrow">Tesorería</div><h1>Saldos y caja</h1><p>Controla cuánto tienes en cada cuenta bancaria y en efectivo.</p></div></div>
        <div class="card tes-empty">
          <div class="tes-empty-ic">🏦</div>
          <h2>Primero, haz el cuadre inicial</h2>
          <p>Ingresa <b>una sola vez</b> cuánto dinero tienes hoy en cada cuenta y en caja. Desde el día siguiente:</p>
          <ul><li>Los <b>cobros</b> que registres en la hoja se suman solos a su cuenta (por BANCO + DESTINATARIO) o a la caja si fueron en efectivo.</li>
          <li>Los <b>gastos diarios</b> de la hoja BD Egresos se descuentan solos de la caja.</li>
          <li>Tú registras aquí depósitos, retiros, transferencias y gastos extra.</li></ul>
          <button class="btn primary" data-action="tesCuadre">Hacer cuadre inicial</button>
        </div>
        <div class="section-title">Cuentas detectadas en tus cobros <small>Total cobrado históricamente (referencia, no es saldo)</small></div>
        <div class="acc-grid">${cs.map(a=>`<div class="card acc">${this.avatar(a)}<div class="acc-t"><b>${U.esc(a.banco)}</b><span>${U.esc(a.titular)}</span></div><div class="acc-v muted" style="font-size:18px">${U.money(H.get(a.k)||0)}</div></div>`).join('')}</div>`;
      return;
    }
    const movs=this.movimientos(), S=this.saldos(movs), caja=S.find(s=>s.caja), bancos=S.filter(s=>!s.caja);
    const totB=U.sum(bancos,s=>s.saldo), tot=totB+(caja?caja.saldo:0);
    const mesAct=U.mesKey(U.hoy()), gMes=U.sum(movs.filter(m=>m.cuenta==='CAJA'&&m.fecha.slice(0,7)===mesAct),m=>m.salida);
    const meses=[...new Set(movs.map(m=>m.fecha.slice(0,7)))].sort().reverse();
    v.innerHTML=`
      <div class="page-head"><div><div class="eyebrow">Tesorería</div><h1>Saldos y caja</h1><p>Cuadre inicial al ${U.fdate(U.parse(c))} · cobros de la hoja hasta ${U.fdate(State.M.fechaMax)} · ${this.st.movs.length} movimiento${this.st.movs.length!==1?'s':''} registrado${this.st.movs.length!==1?'s':''}</p></div>
        <div class="period"><button class="btn primary" data-action="tesMov">＋ Registrar movimiento</button><button class="btn" data-action="tesCuadre">Cuadre</button><button class="btn" data-action="tesRespaldo">Respaldo</button></div></div>
      <div class="grid g-4">
        ${kpi('<i class="dot"></i>Total disponible',`<span class="${tot<0?'neg':''}">${cnt(tot)}</span>`,'Bancos + caja','lux gx gv')}
        ${kpi('<i class="dot"></i>En bancos',cnt(totB),`${bancos.length} cuenta${bancos.length!==1?'s':''}`,'lux gx gu')}
        ${kpi('<i class="dot"></i>En caja',`<span class="${caja&&caja.saldo<0?'neg':''}">${cnt(caja?caja.saldo:0)}</span>`,'Efectivo disponible','lux gx gm click','data-action="tesFiltroCta" data-k="CAJA"')}
        ${kpi('<i class="dot"></i>Salidas de caja',cnt(gMes),`En ${U.mesLabel(mesAct)}`,'lux gx gg')}
      </div>
      ${caja&&caja.saldo<0?`<div class="note"><span class="ic">!</span><span><b>La caja está en negativo.</b> Probablemente los gastos se pagaron también con dinero de bancos o faltan retiros por registrar. Registra un <b>retiro a caja</b> o ajusta el cuadre.</span></div>`:''}
      <div class="section-title">Cuentas <small>Clic en una cuenta para ver sus movimientos</small></div>
      <div class="acc-grid">${S.filter(a=>this.filtro.todas||a.caja||a.inicial||a.entradas||a.salidas).map(a=>`
        <div class="card acc ${a.caja?'acc-caja':''} ${this.filtro.cuenta===a.k?'on':''}" data-action="tesFiltroCta" data-k="${U.esc(a.k)}">
          ${this.avatar(a)}<div class="acc-t"><b>${U.esc(a.banco)}</b><span>${U.esc(a.titular)}</span></div>
          <div class="acc-v num ${a.saldo<0?'neg':''}">${U.money(a.saldo)}</div>
          <div class="acc-f"><span class="up">↑ ${U.money(a.entradas)}</span><span class="down">↓ ${U.money(a.salidas)}</span><span class="muted">inicial ${U.money(a.inicial)}</span></div>
          <div class="acc-b"><button class="btn sm" data-action="tesMov" data-t="ingreso" data-k="${U.esc(a.k)}">＋ Ingreso</button><button class="btn sm" data-action="tesMov" data-t="${a.caja?'egreso':'retiro'}" data-k="${U.esc(a.k)}">${a.caja?'− Gasto':'↧ Retiro'}</button></div>
        </div>`).join('')}</div>
      ${(()=>{ const ocultas=S.filter(a=>!(a.caja||a.inicial||a.entradas||a.salidas)).length; return ocultas?`<div style="text-align:center;margin-top:12px"><button class="btn sm" data-action="tesToggleCtas">${this.filtro.todas?'Ocultar cuentas sin movimiento':`Mostrar ${ocultas} cuenta${ocultas>1?'s':''} sin movimiento`}</button></div>`:''; })()}
      <div class="card mt"><div class="card-head"><div><h3>Movimientos</h3><p class="sub">Automáticos (cobros de la hoja y BD Egresos) y registrados por ti</p></div>
        <div class="period">
          <select class="sel" data-change="tesCta"><option value="TODAS">Todas las cuentas</option>${S.map(a=>`<option value="${U.esc(a.k)}" ${this.filtro.cuenta===a.k?'selected':''}>${U.esc(a.nombre)}</option>`).join('')}</select>
          <select class="sel" data-change="tesMes"><option value="TODOS">Todo desde el corte</option>${meses.map(m=>`<option value="${m}" ${this.filtro.mes===m?'selected':''}>${U.mesLabel(m)}</option>`).join('')}</select>
          <select class="sel" data-change="tesOrigen"><option value="todos">Todos</option><option value="manual" ${this.filtro.origen==='manual'?'selected':''}>Solo registrados</option><option value="auto" ${this.filtro.origen==='auto'?'selected':''}>Solo automáticos</option></select>
          <button class="btn sm" data-action="tesCSV">⬇ Excel (CSV)</button></div></div>
        <div id="tesTabla"></div></div>`;
    this._movs=movs; this.tabla();
  },
  tabla(){
    const f=this.filtro; let L=this._movs||[];
    if(f.cuenta!=='TODAS') L=L.filter(m=>m.cuenta===f.cuenta);
    if(f.mes!=='TODOS') L=L.filter(m=>m.fecha.slice(0,7)===f.mes);
    if(f.origen==='manual') L=L.filter(m=>!m.auto); else if(f.origen==='auto') L=L.filter(m=>m.auto);
    this._vis=L;
    const tipo={cobro:'<span class="badge b-pag">↑ Cobro</span>',gasto:'<span class="badge b-venc">↓ Egreso BD</span>',ingreso:'<span class="badge b-pag">＋ Ingreso</span>',egreso:'<span class="badge b-venc">− Egreso</span>',transfer:'<span class="badge b-porv">⇄ Transferencia</span>'};
    const el=document.getElementById('tesTabla'); if(!el) return;
    el.innerHTML = L.length ? `<div class="tbl-wrap" style="max-height:520px;overflow:auto"><table><thead><tr><th>Fecha</th><th>Cuenta</th><th>Tipo</th><th>Concepto</th><th class="r">Entrada</th><th class="r">Salida</th><th></th></tr></thead>
      <tbody>${L.slice(0,400).map(m=>`<tr><td>${U.fdate(U.parse(m.fecha))}</td><td>${U.esc(this.info(m.cuenta).nombre)}</td><td>${tipo[m.tipo]}</td><td>${U.esc(m.concepto)}${m.auto?' <span class="chip-g">auto</span>':''}</td>
        <td class="r num up">${m.entrada?U.money(m.entrada):''}</td><td class="r num down">${m.salida?U.money(m.salida):''}</td>
        <td class="r">${m.auto?'':(this.borrar===m.id?`<button class="btn sm" data-action="tesDelOk" data-id="${m.id}" style="color:var(--crit)">Eliminar</button> <button class="btn sm" data-action="tesDelNo">No</button>`:`<button class="btn ghost sm" data-action="tesDel" data-id="${m.id}" title="Eliminar">✕</button>`)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">${L.length} movimiento${L.length!==1?'s':''}${L.length>400?' (se muestran 400)':''}</td><td class="r num">${U.money(U.sum(L,m=>m.entrada))}</td><td class="r num">${U.money(U.sum(L,m=>m.salida))}</td><td></td></tr></tfoot></table></div>`
      : '<div class="empty">Aún no hay movimientos después del corte.</div>';
  },

  /* ---------------- MODALES ---------------- */
  abrirModal(html){ ModalImg.tk++; ModalImg.tipo='tes'; document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('on'); },
  cuadre(){
    this.cargar(); const cs=this.cuentas(), H=this.historico(), c=this.st.corte||U.iso(U.hoy());
    this.abrirModal(`
      <div class="dr-head"><div style="flex:1;min-width:0;position:relative;z-index:1"><div class="lbl-s">Tesorería</div><h2 style="font-size:22px">Cuadre inicial</h2><div class="muted" style="font-size:12px">Saldo real de cada cuenta al cierre de la fecha de corte</div></div><button class="btn ghost" data-action="cerrarModal">${I.x}</button></div>

        <div class="tes-cuadre">${cs.map(a=>`<div class="tes-row">${this.avatar(a,38)}<div class="acc-t"><b>${U.esc(a.banco)}</b><span>${U.esc(a.titular)} · cobrado histórico ${U.money(H.get(a.k)||0)}</span></div><input type="number" step="0.01" inputmode="decimal" data-ini="${U.esc(a.k)}" value="${this.st.iniciales[a.k]!=null?this.st.iniciales[a.k]:''}" placeholder="0.00"></div>`).join('')}</div>
        <details class="custom"><summary>＋ Agregar otra cuenta</summary>
          <div class="rep-form" style="grid-template-columns:1fr 1fr auto;margin-top:10px;align-items:end">

          <div class="muted" style="font-size:11.5px;margin-top:6px">Usa el mismo nombre de banco y titular que en la hoja (columnas BANCO y DESTINATARIO) para que los cobros se sumen a esa cuenta.</div></details>

  },

  async importar(file){
    try{ const d=JSON.parse(await file.text()); if(!d||!('movs' in d)||!('iniciales' in d)) throw new Error('formato');
      this.st={corte:d.corte||null,iniciales:d.iniciales||{},extras:d.extras||[],movs:d.movs||[]}; this.guardar(); ModalImg.cerrar(); if(State.vista==='tesoreria') this.vista(); toast(`Respaldo restaurado: ${this.st.movs.length} movimientos.`); }

    const txt='﻿'+rows.map(r=>r.map(v=>{ v=String(v); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(';')).join('\r\n');
    Lote.bajar(new Blob([txt],{type:'text/csv'}),`movimientos_tesoreria_${U.iso(new Date())}.csv`);

/* =========================================================
   ENVIADOS — seguimiento de cada "Detalle de pedidos" enviado
   · Se registra al Descargar / Compartir / Copiar la imagen (o al generar el ZIP),
     solo cuando el periodo es "Solo pendientes".
   · Cada envío guarda la firma de sus pedidos (fecha|cliente|grupo|valor|cantidad),
     así sigue reconociéndolos aunque se agreguen filas nuevas a la hoja.
   · Pagado automático: cuando todos sus pedidos dejan de estar en PTE en la hoja.
   · Abonos (parciales o totales) se registran aquí; reducen el saldo del cliente en todo
     el tablero (Pagos.totalCliente) mientras sus pedidos sigan en PTE en la hoja.
   Estado en este navegador: { envios:[...], abonos:[...] }
   ========================================================= */
const Envios = {
  KEY:'deliz-envios', st:null, filtro:{estado:'pendiente', grupo:'TODOS', q:''}, borrar:null,
  cargar(){ try{ this.st=JSON.parse(localStorage.getItem(this.KEY)||'null'); }catch(e){ this.st=null; }
    if(!this.st||typeof this.st!=='object') this.st={envios:[],abonos:[]}; this.st.envios=this.st.envios||[]; this.st.abonos=this.st.abonos||[]; },
  guardar(){ try{ localStorage.setItem(this.KEY,JSON.stringify(this.st)); }catch(e){} Sync.cambio(); },
  pte(sig){ const v=State.sig&&State.sig.get(sig); return !!(v&&v.pendiente); },
  /* Abono vigente = alguno de sus pedidos sigue en PTE en la hoja */
  vigente(a){ if(a.consumido) return false; if(a.favor) return true; return a.sigs.some(s=>this.pte(s)); },
  recalc(){
    if(!this.st) this.cargar();
    const m=new Map(); for(const a of this.st.abonos){ if(this.vigente(a)) m.set(a.key,(m.get(a.key)||0)+a.valor); }
    Pagos.cache=m;
  },
  aplicar(){ this.recalc(); State.K=Calc.kpis(State.M,State.mensual); document.getElementById('pillCobros').textContent=State.K.deudores||''; const p=document.getElementById('pillEnv'); if(p) p.textContent=this.pendientes().length||''; },
  abonosDe(e){ const A=this.st.abonos; if(this._abRef!==A||this._abLen!==A.length){ this._abRef=A; this._abLen=A.length; this._abIdx=new Map(); for(const a of A){ const l=this._abIdx.get(a.envioId); l?l.push(a):this._abIdx.set(a.envioId,[a]); } } return this._abIdx.get(e.id)||[]; },
  limite:150,
  estado(e){
    const pend=e.sigs.filter(s=>this.pte(s)), valPend=U.sum(pend,s=>State.sig.get(s).valor), ab=U.sum(this.abonosDe(e).filter(a=>this.vigente(a)),a=>a.valor);
    const abTot=U.sum(this.abonosDe(e),a=>a.valor), saldo=Math.max(0,U.r2(valPend-ab));
    let est='pendiente';
    if(e.cerrado==='reemplazado') est='reemplazado';
    else if(!pend.length) est='pagado';
    else if(saldo<=0.004) est='pagado';
    else if(e.cerrado==='abonado') est='abonado';
    return {est,saldo,abonado:abTot,valPend,nPend:pend.length};
  },
  pendientes(){ return (this.st?this.st.envios:[]).filter(e=>this.estado(e).est==='pendiente'); },
  /* Registrar un envío (individual o lote) */
  registrar(c, filas){
    if(!this.st) this.cargar();
    const sigs=filas.filter(f=>f.pendiente).map(f=>f.sig); if(!sigs.length) return;
    const key=c.key, hoy=U.iso(new Date()), set=new Set(sigs);
    const igual=this.st.envios.find(e=>e.key===key && e.cerrado!=='reemplazado' && e.sigs.length===sigs.length && e.sigs.every(s=>set.has(s)));
    if(igual){ igual.fecha=hoy; this.guardar(); return; }
    this.st.envios.forEach(e=>{ if(e.key===key && !e.cerrado && this.estado(e).est==='pendiente') e.cerrado='reemplazado'; });
    const pend=filas.filter(f=>f.pendiente), abonoPrevio=Pagos.totalCliente(key);
    this.st.envios.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), key, nombre:c.nombre, grupo:c.grupo, fecha:hoy,
      desde:U.iso(pend[0].f), hasta:U.iso(pend[pend.length-1].f), consumo:U.r2(U.sum(pend,f=>f.valor)), abonoPrevio:U.r2(abonoPrevio),
      monto:U.r2(U.sum(pend,f=>f.valor)-abonoPrevio), sigs, cerrado:null});
    this.guardar(); this.aplicar();
  },
  abonar(id, valor, fecha, nota){
    const e=this.st.envios.find(x=>x.id===id); if(!e) return;
    const est=this.estado(e), pendSigs=e.sigs.filter(s=>this.pte(s));
    this.st.abonos.push({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), envioId:id, key:e.key, fecha, valor:U.r2(valor), nota:nota||'', sigs:pendSigs});
    if(valor < est.saldo-0.004) e.cerrado='abonado';
    this.guardar(); this.aplicar();
  },
  deshacer(id){ const e=this.st.envios.find(x=>x.id===id); if(!e) return; this.st.abonos=this.st.abonos.filter(a=>a.envioId!==id); if(e.cerrado==='abonado') e.cerrado=null; this.guardar(); this.aplicar(); },
  eliminar(id){ this.st.envios=this.st.envios.filter(e=>e.id!==id); this.borrar=null; this.guardar(); this.aplicar(); },

  /* ---------------- VISTA ---------------- */
  vista(){
    this.cargar(); this.recalc();
    const v=document.getElementById('view'), hoy=U.hoy(), E=this.st.envios.map(e=>({e,...this.estado(e)}));
    const vivos=E.filter(x=>x.est!=='reemplazado'), pend=vivos.filter(x=>x.est==='pendiente');
    const totEnv=U.sum(vivos,x=>x.e.monto), porCobrar=U.sum(pend,x=>x.saldo), cobrado=Math.max(0,U.r2(totEnv-U.sum(vivos.filter(x=>x.est!=='pagado'),x=>x.saldo)-U.sum(vivos.filter(x=>x.est==='abonado'),x=>0)));
    const grupos=[...new Set(vivos.map(x=>x.e.grupo))].sort();
    v.innerHTML=`
      <div class="page-head"><div><div class="eyebrow">Seguimiento de cobros</div><h1>Detalles enviados</h1><p>Cada detalle de pedidos que descargas, compartes o copias queda registrado aquí. Se marca pagado solo cuando sus pedidos dejan de estar en PTE en tu hoja.</p></div>
        <div class="period"><button class="btn" data-action="envRespaldo">Respaldo</button></div></div>
      <div class="grid g-4">
        ${kpi('<i class="dot"></i>Pendientes de pago',cnt(pend.length,'int'),`de ${vivos.length} enviados`,'lux gx gc')}
        ${kpi('<i class="dot"></i>Por cobrar',cnt(porCobrar),'Saldo de lo enviado','lux gx gv')}
        ${kpi('<i class="dot"></i>Pagados',cnt(vivos.filter(x=>x.est==='pagado').length,'int'),'Completos','lux gx gu')}
        ${kpi('<i class="dot"></i>Con abono parcial',cnt(vivos.filter(x=>x.est==='abonado').length,'int'),'El saldo pasa al siguiente detalle','lux gx gm')}
      </div>
      <div class="toolbar">
        <div class="seg"><button class="${this.filtro.estado==='pendiente'?'on':''}" data-action="envEstado" data-e="pendiente">Pendientes (${pend.length})</button><button class="${this.filtro.estado==='cerrados'?'on':''}" data-action="envEstado" data-e="cerrados">Pagados y abonados</button><button class="${this.filtro.estado==='todos'?'on':''}" data-action="envEstado" data-e="todos">Todos</button></div>
        <div class="search">${I.search}<input data-input="envQ" placeholder="Buscar cliente o grupo…" value="${U.esc(this.filtro.q)}" autocomplete="off"></div>
        <select class="sel" data-change="envGrupo"><option value="TODOS">Todos los grupos</option>${grupos.map(g=>`<option ${this.filtro.grupo===g?'selected':''}>${U.esc(g)}</option>`).join('')}</select>
      </div>
      <div class="card" style="padding:8px 16px"><div id="envLista"></div></div>`;
    this._E=E; this.lista();
  },
  lista(){
    const f=this.filtro, hoy=U.hoy(); let L=(this._E||[]).filter(x=>x.est!=='reemplazado');
    if(f.estado==='pendiente') L=L.filter(x=>x.est==='pendiente'); else if(f.estado==='cerrados') L=L.filter(x=>x.est==='pagado'||x.est==='abonado');
    if(f.grupo!=='TODOS') L=L.filter(x=>x.e.grupo===f.grupo);
    const t=U.norm(f.q).split(/\s+/).filter(Boolean); if(t.length) L=L.filter(x=>{ const s=U.norm(x.e.nombre+' '+x.e.grupo); return t.every(w=>s.includes(w)); });
    L.sort((a,b)=>(a.est==='pendiente'?0:1)-(b.est==='pendiente'?0:1)||a.e.fecha.localeCompare(b.e.fecha)||b.saldo-a.saldo);

    const el=document.getElementById('envLista'); if(!el) return;
    el.innerHTML = L.length ? L.slice(0,this.limite).map(x=>{ const e=x.e, dias=U.dias(U.parse(e.fecha),hoy), ini=e.nombre.split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('');

        <div class="env-n" data-action="cliente" data-k="${U.esc(e.key)}"><b>${U.esc(e.nombre)}</b><span><span class="chip-g">${U.esc(e.grupo)}</span> · pedidos del ${U.fdateShort(U.parse(e.desde))} al ${U.fdateShort(U.parse(e.hasta))}</span></div>
        <div class="env-c"><small>Enviado</small><b>${U.fdate(U.parse(e.fecha))}</b><span class="muted">${dias===0?'hoy':`hace ${dias} día${dias>1?'s':''}`}</span></div>
        <div class="env-c r"><small>Monto</small><b class="num">${U.money(e.monto)}</b>${x.abonado?`<span class="up">abonó ${U.money(x.abonado)}</span>`:''}</div>
        <div class="env-c r env-s"><small>Saldo</small><b class="num ${x.saldo>0?'down':'up'}">${U.money(x.saldo)}</b>${x.est==='abonado'?'<span class="muted">pasa al siguiente</span>':''}</div>
        <div class="env-e">${badge[x.est]||''}</div>
        <div class="env-a">${x.est==='pendiente'?`<button class="btn sm primary" data-action="envPagoTotal" data-id="${e.id}">✓ Pagó todo</button><button class="btn sm" data-action="envAbono" data-id="${e.id}">Abono</button><button class="btn ghost sm" data-action="envWa" data-k="${U.esc(e.key)}" title="Recordatorio por WhatsApp">${I.wa}</button>`
          :(this.abonosDe(e).length?`<button class="btn sm" data-action="envDeshacer" data-id="${e.id}" title="Quitar abonos y volver a pendiente">↺ Deshacer</button>`:'')}
          ${this.borrar===e.id?`<button class="btn sm" data-action="envDelOk" data-id="${e.id}" style="color:var(--crit)">Eliminar</button><button class="btn sm" data-action="envDelNo">No</button>`:`<button class="btn ghost sm" data-action="envDel" data-id="${e.id}" title="Eliminar registro">✕</button>`}</div>
      </div>`; }).join('')+(L.length>this.limite?`<div style="text-align:center;padding:14px"><button class="btn" data-action="envMas">Mostrar más · quedan ${L.length-this.limite}</button></div>`:'')

/* ---------------- BUSCADOR GLOBAL (Ctrl+K o /) ---------------- */
const Cmd = {
  items:[], sel:0,
  abrir(){ const el=document.getElementById('cmd'); el.classList.add('on'); const i=document.getElementById('cmdIn'); i.value=''; this.buscar(''); setTimeout(()=>i.focus(),20); },
  cerrar(){ document.getElementById('cmd').classList.remove('on'); },
  abierto(){ return document.getElementById('cmd').classList.contains('on'); },
  buscar(q){
    const M=State.M, t=U.norm(q), out=[];
    const vistas=[['Dashboard','dashboard'],['Cobros pendientes','cobros'],['Clientes','clientes'],['Tesorería · saldos y caja','tesoreria'],['Detalles enviados','envios']];
    vistas.filter(([l])=>!t||U.norm(l).includes(t)).forEach(([l,v])=>out.push({k:'Sección',n:l,v:'',run:()=>Nav.ir(v)}));
    M.meses.filter(m=>!t||U.norm(U.mesLabel(m)).includes(t)).slice(0,t?4:0).forEach(m=>out.push({k:'Mes',n:U.mesLabel(m),v:'',run:()=>Nav.ir('mes/'+m)}));
    M.grupos.filter(g=>t&&U.norm(g).includes(t)).forEach(g=>out.push({k:'Grupo',n:g,v:'Ver clientes',run:()=>{State.clientes.grupo=g;Nav.ir('clientes');}}));
    const cl=(t?Calc.buscar([...M.clientes.values()],q):[...M.clientes.values()].filter(c=>Calc.saldo(c)>0.004)).sort((a,b)=>Calc.saldo(b)-Calc.saldo(a)||b.total-a.total).slice(0,8);
    const keys=cl.map(c=>c.key);
    cl.forEach(c=>out.push({k:'Cliente',n:`${c.nombre} · ${c.grupo}`,v:Calc.saldo(c)>0.004?`<span style="color:var(--crit)">${U.money(Calc.saldo(c))}</span>`:'<span class="muted">Al día</span>',run:()=>Drawer.abrir(c.key,keys)}));
    this.items=out; this.sel=0; this.pintar();
  },
  pintar(){ document.getElementById('cmdRes').innerHTML = this.items.length ? this.items.map((it,i)=>`<div class="cmd-it ${i===this.sel?'sel':''}" data-action="cmdRun" data-i="${i}"><span class="k">${it.k}</span><span class="n">${U.esc(it.n)}</span><span class="v">${it.v}</span></div>`).join('') : '<div class="empty">Sin resultados</div>';
    const s=document.querySelector('.cmd-it.sel'); if(s) s.scrollIntoView({block:'nearest'}); },
  run(i){ const it=this.items[i]; if(!it) return; this.cerrar(); it.run(); },
  tecla(e){ if(e.key==='ArrowDown'){ this.sel=Math.min(this.items.length-1,this.sel+1); this.pintar(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ this.sel=Math.max(0,this.sel-1); this.pintar(); e.preventDefault(); }
    else if(e.key==='Enter'){ this.run(this.sel); e.preventDefault(); } }
};
