/* =========================================================
   CONEXIÓN CON GOOGLE SHEETS (Apps Script)
   - Remoto: llamadas a la API (POST text/plain, sin preflight, con tiempo límite)
   - Sync:   guarda por diferencias, cola persistente con reintentos y ✓ solo
             cuando Google confirma. La base local (localStorage) es solo caché.
   ========================================================= */
/* Almacén grande del navegador (IndexedDB): la copia local ya no depende del límite de 5 MB */
const IDB = {
  _db:null,
  abrir(){
    if(this._db) return this._db;
    this._db=new Promise((res,rej)=>{
      if(!('indexedDB' in window)) return rej(new Error('sin IndexedDB'));
      const r=indexedDB.open('deliz',1), t=setTimeout(()=>rej(new Error('IndexedDB no responde')),4000);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>{ clearTimeout(t); res(r.result); }; r.onerror=()=>{ clearTimeout(t); rej(r.error); }; r.onblocked=()=>{ clearTimeout(t); rej(new Error('IndexedDB bloqueado')); };
    });
    this._db.catch(()=>{ this._db=null; });
    return this._db;
  },
  async op(modo,fn){ const db=await this.abrir(); return new Promise((res,rej)=>{ const tx=db.transaction('kv',modo), st=tx.objectStore('kv'), q=fn(st); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('abortado')); }); },
  get(k){ return this.op('readonly',st=>st.get(k)); },
  set(k,v){ return this.op('readwrite',st=>st.put(v,k)); },
  del(k){ return this.op('readwrite',st=>st.delete(k)); }
};

const Remoto = {
  K_URL:'deliz-api', K_CLAVE:'deliz-clave', K_CACHE:'deliz-cache', API_MIN:3, viejo:false,
  url(){ return CONFIG.apiUrl || (()=>{ try{ return localStorage.getItem(this.K_URL)||''; }catch(e){ return ''; } })(); },
  clave(){ try{ return localStorage.getItem(this.K_CLAVE)||''; }catch(e){ return ''; } },
  async llamar(action, extra, ms=30000){
    const url=this.url(); if(!url){ const e=new Error('Falta el enlace de la API'); e.code='URL'; throw e; }
    if(navigator.onLine===false){ const e=new Error('Sin conexión a internet'); e.code='RED'; throw e; }
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),ms);
    let r;
    try{ r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,clave:this.clave(),...extra}),signal:ctl.signal,redirect:'follow',cache:'no-store'}); }
    catch(err){ const e=new Error(err.name==='AbortError'?'Google tardó demasiado en responder':'Sin conexión con Google'); e.code='RED'; throw e; }
    finally{ clearTimeout(t); }
    if(r.status>=500||r.status===429){ const e=new Error('Google respondió con error '+r.status+' (temporal)'); e.code='RED'; throw e; }
    let j; try{ j=await r.json(); }catch(err){ const e=new Error('Respuesta inválida de la API (¿la URL termina en /exec y está publicada para “Cualquier usuario”?)'); e.code='API'; throw e; }
    if(!j.ok){ const e=new Error(j.error||'Error de la API'); e.code=j.code||'API'; if(e.code==='OCUPADO') e.code='RED'; throw e; }
    this.viejo=(j.v||1)<this.API_MIN;
    return j;
  },
  async leerCache(){
    try{ const c=await IDB.get('cache'); if(c&&c.raw) return c; }catch(e){}
    try{ return JSON.parse(localStorage.getItem(this.K_CACHE)||'null'); }catch(e){ return null; }
  },
  async guardarCache(c){
    try{ await IDB.set('cache',c); try{ localStorage.removeItem(this.K_CACHE); }catch(x){} return; }catch(e){}
    try{ localStorage.setItem(this.K_CACHE,JSON.stringify(c)); }catch(e){ console.warn('Sin espacio para la copia local'); }
  },
  async borrarCache(){ try{ await IDB.del('cache'); }catch(e){} try{ localStorage.removeItem(this.K_CACHE); }catch(e){} }
};

const Sync = {
  K_COLA:'deliz-cola',
  TABLAS:['MOVIMIENTOS','CUENTAS','ENVIOS','ABONOS','AJUSTES'],
  cola:[], ultima:null, enVuelo:false, intento:0, tRetry:null, tFlush:null, tDiff:null, sucio:false, estado:'ok', error:'', leido:null, usuario:'', pendienteAplicar:null, aplicando:false, rechazados:[],
  init(){ try{ this.cola=JSON.parse(localStorage.getItem(this.K_COLA)||'[]'); if(!Array.isArray(this.cola)) this.cola=[]; }catch(e){ this.cola=[]; }
    addEventListener('online',()=>{ this.intento=0; this.flush(); });
    addEventListener('beforeunload',e=>{ if(this.sucio) this.diff(); if(this.cola.length){ e.preventDefault(); e.returnValue=''; } });
    addEventListener('pagehide',()=>{ if(this.sucio) this.diff(); });
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ if(this.sucio) this.diff(); return; }
      this.flush(); const nuevoDia=State.M&&+State.M.hoy!==+U.hoy();
      if(nuevoDia||!this.leidoMs||Date.now()-this.leidoMs>180000) this.refrescar(false); });
    // Varias pestañas abiertas: se mantienen al día entre ellas (evita borrar lo que hizo la otra)
    addEventListener('storage',e=>{
      if(e.key===this.K_COLA){ try{ this.cola=JSON.parse(e.newValue||'[]'); }catch(x){} this.pintar(); return; }
      if([Tes.KEY,Envios.KEY,CONFIG.storageImg].includes(e.key)){
        clearTimeout(this.tDiff); this.sucio=false;
        Tes.cargar(); Envios.cargar(); ImgCfg.cargar(); this.ultima=this.foto();
        clearTimeout(this._tOtra); this._tOtra=setTimeout(()=>{ if(!State.M) return; Envios.aplicar(); if(!this.ocupado()) UI.render(false); },300);
      }
    });
  },
  guardarCola(){ try{ localStorage.setItem(this.K_COLA,JSON.stringify(this.cola)); }catch(e){ toast('⚠ El navegador no tiene espacio para la cola de cambios. Sincroniza ahora.'); } },
  ls(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } },
  /* Foto de lo que hay en el navegador: tabla → id → JSON */
  foto(){
    const tes=this.ls(Tes.KEY)||{}, env=this.ls(Envios.KEY)||{}, img=this.ls(CONFIG.storageImg);
    const F={}; this.TABLAS.forEach(t=>F[t]=new Map());
    (tes.movs||[]).forEach(m=>m&&m.id&&F.MOVIMIENTOS.set(String(m.id),m));
    (tes.extras||[]).forEach(e=>e&&e.k&&F.CUENTAS.set(e.k,{id:e.k,k:e.k}));
    (env.envios||[]).forEach(e=>e&&e.id&&F.ENVIOS.set(String(e.id),e));
    (env.abonos||[]).forEach(a=>a&&a.id&&F.ABONOS.set(String(a.id),a));
    if(tes.corte) F.AJUSTES.set('corte',{id:'corte',v:tes.corte});
    if(tes.iniciales&&Object.keys(tes.iniciales).length) F.AJUSTES.set('iniciales',{id:'iniciales',v:tes.iniciales});
    if(img) F.AJUSTES.set('img',{id:'img',v:img});
    const S={}; for(const t of this.TABLAS){ S[t]=new Map(); F[t].forEach((o,id)=>S[t].set(id,JSON.stringify(o))); }
    return S;
  },
  /* Escribe en el navegador el estado {tabla → Map(id → objeto)} */
  escribir(B){
    const aj=id=>{ const o=B.AJUSTES.get(id); return o?o.v:null; };
    const tes={corte:aj('corte')||null, iniciales:aj('iniciales')||{}, extras:[...B.CUENTAS.values()].map(o=>({k:o.k||o.id})), movs:[...B.MOVIMIENTOS.values()]};
    const env={envios:[...B.ENVIOS.values()], abonos:[...B.ABONOS.values()]};
    this.aplicando=true;
    try{ localStorage.setItem(Tes.KEY,JSON.stringify(tes)); localStorage.setItem(Envios.KEY,JSON.stringify(env));
      const img=aj('img'); if(img) localStorage.setItem(CONFIG.storageImg,JSON.stringify(img)); }catch(e){ toast('⚠ El navegador no tiene espacio suficiente.'); }
    Tes.cargar(); Envios.cargar(); ImgCfg.cargar();
    this.aplicando=false;
  },
  /* Llamado por cada guardar() de los módulos. Se agrupan los cambios seguidos (p. ej. un lote de 80 envíos = 1 cálculo). */
  cambio(){
    if(this.aplicando) return;
    const antes=this.sucio; this.sucio=true; clearTimeout(this.tDiff); this.tDiff=setTimeout(()=>this.diff(),250); if(!antes) this.pintar();
  },
  diff(){
    clearTimeout(this.tDiff); if(!this.sucio) return; this.sucio=false;
    const ahora=this.foto(), antes=this.ultima||{}, nuevas=[], borr={};
    for(const t of this.TABLAS){ const A=antes[t]||new Map(), B=ahora[t];
      B.forEach((s,id)=>{ if(A.get(id)!==s) nuevas.push({t,id,op:'put',v:JSON.parse(s)}); });
      A.forEach((s,id)=>{ if(!B.has(id)){ nuevas.push({t,id,op:'del'}); borr[t]=(borr[t]||0)+1; } }); }
    // Protección: borrado masivo inesperado (datos del navegador perdidos, respaldo equivocado, etc.)
    const masivo=Object.entries(borr).filter(([t,n])=>n>=20 && n>((antes[t]||new Map()).size*0.4));
    if(masivo.length){
      const txt=masivo.map(([t,n])=>`${n} de ${t}`).join(', ');
      if(!confirm(`Atención: este cambio BORRARÁ de Google Drive ${txt}.\n\n¿Continuar? (Cancelar = no se borra nada)`)){
        const B={}; for(const t of this.TABLAS){ B[t]=new Map(); (antes[t]||new Map()).forEach((s,id)=>B[t].set(id,JSON.parse(s))); }
        this.escribir(B); this.ultima=this.foto(); toast('Cancelado: no se borró nada.');
        if(State.M){ Envios.aplicar(); UI.render(false); } return;
      }
    }
    this.ultima=ahora;
    if(nuevas.length){ this.cola.push(...nuevas); this.compactar(); this.guardarCola(); this.pintar(); clearTimeout(this.tFlush); this.tFlush=setTimeout(()=>this.flush(),500); }
  },
  /* Para cada registro solo importa la última operación */
  compactar(){ const m=new Map(); this.cola.forEach(o=>{ const k=o.t+'|'+o.id; m.delete(k); m.set(k,o); }); this.cola=[...m.values()]; },
  async flush(){
    if(this.sucio) this.diff();
    if(this.enVuelo||!this.cola.length) { this.pintar(); return; }
    if(!Remoto.url()||!Remoto.clave()) return;
    clearTimeout(this.tRetry); this.enVuelo=true; this.estado='guardando'; this.pintar();
    const lote=this.cola.slice(0,250), id='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    try{
      const j=await Remoto.llamar('guardar',{lote:{id,ops:lote}},60000);
      // Quitar lo enviado (si el registro cambió mientras viajaba, se conserva la versión nueva)
      const env=new Set(lote); this.cola=this.cola.filter(o=>!env.has(o)); this.guardarCola();
      this.intento=0; this.estado='ok'; this.error='';
      if(j.rechazados&&j.rechazados.length){ this.rechazados.push(...j.rechazados.map(r=>({...r,fecha:new Date().toISOString()})));
        toast(`⚠ Google rechazó ${j.rechazados.length} cambio(s): ${j.rechazados[0].error}. Revisa “Base en Google Drive”.`); }
      this.enVuelo=false; this.pintar();
      if(this.cola.length) return this.flush();
      if(!(j.rechazados&&j.rechazados.length)) toast('✓ Guardado en Google Drive');
    }catch(err){
      this.enVuelo=false; this.error=err.message;
      if(err.code==='CLAVE'){ this.estado='error'; this.pintar(); Login.pedir('Tu clave cambió o ya no es válida. Ingrésala de nuevo; tus cambios siguen en espera.').then(()=>this.flush()); return; }
      this.estado=err.code==='RED'?'offline':'error'; this.intento++;
      const ms=[3000,8000,20000,45000,90000][Math.min(this.intento-1,4)];
      this.tRetry=setTimeout(()=>this.flush(),ms); this.pintar();
      if(this.intento===1) toast('⚠ No se pudo guardar todavía: '+err.message+'. Se reintentará solo.');
    }
  },
  /* Datos que vienen de Google → módulos locales (+ cambios que aún no se envían) */
  aplicarTablas(tablas){
    if(this.sucio) this.diff();
    const B={}; this.TABLAS.forEach(t=>{ B[t]=new Map(); (tablas&&tablas[t]||[]).forEach(o=>{ if(!o) return; const id=t==='CUENTAS'?(o.k||o.id):o.id; if(id) B[t].set(String(id),o); }); });
    this.cola.forEach(op=>{ if(!B[op.t]) return; if(op.op==='del') B[op.t].delete(String(op.id)); else B[op.t].set(String(op.id),op.v); });
    this.escribir(B);
    this.ultima=this.foto();
  },
  procesarRespuesta(r){
    const datos=DataSource.desdeServidor(r), firma=this.firmaDe(r);
    Remoto.guardarCache({raw:DataSource.comprimir(datos,DataSource.meta), rep:DataSource.rep, tablas:r.tablas, usuario:r.usuario, leido:r.leido, firma});
    this.usuario=r.usuario; this.leido=r.leido; this.leidoMs=Date.now();
    return {datos, firma};
  },
  /* ¿El usuario está a mitad de algo? Entonces no se redibuja la pantalla. */
  ocupado(){ const a=document.activeElement, escribe=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='loginClave';
    return ModalImg.abierto()||Drawer.abierto()||Lote.corriendo||escribe||document.getElementById('cmd').classList.contains('on'); },
  /* Relee Google en segundo plano. Si estás ocupado, espera tu confirmación. */
  async refrescar(manual){
    if(this.refrescando) return; this.refrescando=true; if(manual){ this.estado=this.cola.length?this.estado:'leyendo'; this.pintar(); }
    try{
      const r=await Remoto.llamar('leer',{},90000);
      const {datos,firma}=this.procesarRespuesta(r), nuevoDia=State.M&&+State.M.hoy!==+U.hoy();
      if(firma===this.firma && !manual && !nuevoDia){ this.estado=this.cola.length?this.estado:'ok'; this.pintar(); return; }
      if(!manual && this.ocupado()){ this.pendienteAplicar={datos,tablas:r.tablas,firma}; this.pintar(); return; }
      this.aplicar(datos,r.tablas,firma);
      if(manual) toast('Datos actualizados desde Google Drive.');
    }catch(err){
      if(err.code==='CLAVE'){ Login.pedir('Tu clave ya no es válida. Ingrésala de nuevo.').then(()=>this.refrescar(true)); }
      else if(manual) toast('No se pudo actualizar: '+err.message);
      if(!this.cola.length){ this.estado=err.code==='RED'?'offline':'error'; this.error=err.message; }
    }finally{ this.refrescando=false; if(this.estado==='leyendo') this.estado='ok'; this.pintar(); }
  },
  aplicarPendiente(){ const p=this.pendienteAplicar; if(!p) return; this.pendienteAplicar=null; this.aplicar(p.datos,p.tablas,p.firma); },
  aplicar(datos,tablas,firma){ this.pendienteAplicar=null; this.firma=firma; this.aplicarTablas(tablas); App.refrescar(datos); if(!this.cola.length) this.estado='ok'; this.pintar(); },
  firmaDe(r){ const s=JSON.stringify([r.hojas,r.tablas]); let h=0; for(let i=0;i<s.length;i+=3) h=(h*31+s.charCodeAt(i))|0; return s.length+':'+h; },
  hora(iso){ if(!iso) return '—'; const m=String(iso).match(/T(\d\d:\d\d)/); const d=String(iso).slice(0,10); return (d===U.iso(U.hoy())?'hoy ':U.fdate(U.parse(d))+' ')+(m?m[1]:''); },
  pintar(){
    const n=this.cola.length, el=document.getElementById('syncChip'), em=document.getElementById('syncDot');
    let cls='ok', txt='Sincronizado';
    if(this.pendienteAplicar){ cls='nuevo'; txt='Datos nuevos · tocar para ver'; }
    else if(this.sucio&&!n){ cls='work'; txt='Guardando…'; }
    else if(this.estado==='guardando'){ cls='work'; txt=`Guardando ${n} cambio${n!==1?'s':''}…`; }
    else if(this.estado==='leyendo'){ cls='work'; txt='Leyendo Google Drive…'; }
    else if(n){ cls='warn'; txt=`${n} cambio${n!==1?'s':''} sin guardar · reintentar`; }
    else if(this.estado==='offline'){ cls='warn'; txt='Sin conexión · mostrando copia local'; }
    else if(this.estado==='error'){ cls='warn'; txt='Error de conexión · reintentar'; }
    else if(Remoto.viejo){ cls='warn'; txt='Actualiza el Code.gs en Apps Script'; }
    if(el){ el.className='sync-chip '+cls; el.innerHTML=`<i></i><span>${U.esc(txt)}</span>`; el.title=this.error||''; }
    if(em) em.className='sync-dot '+cls;
    const s=document.getElementById('srcInfo'); if(s) s.textContent=`Google Drive${this.usuario?' · '+this.usuario:''} · leído ${this.hora(this.leido)}`;
  },
  click(){ if(this.pendienteAplicar) return this.aplicarPendiente(); if(this.cola.length){ this.intento=0; return this.flush(); } this.refrescar(true); },
  /* Copia completa de lo guardado por el tablero (tesorería, envíos, abonos, ajustes) */
  copia(){
    if(this.sucio) this.diff();
    const F=this.foto(), out={tipo:'deliz-copia-completa', fecha:new Date().toISOString(), usuario:this.usuario, tablas:{}};
    for(const t of this.TABLAS) out.tablas[t]=[...F[t].values()].map(s=>JSON.parse(s));
    Lote.bajar(new Blob([JSON.stringify(out)],{type:'application/json'}),`deliz_copia_completa_${U.iso(new Date())}.json`);
  }
};

/* ---------------- PANTALLA DE ACCESO ---------------- */
const Login = {
  _p:null,
  pedir(msg){
    if(this._p) return this._p;
    const L=document.getElementById('login'); L.hidden=false; document.getElementById('splash').classList.add('off');
    document.getElementById('loginUrlF').style.display=CONFIG.apiUrl?'none':'';
    document.getElementById('loginUrl').value=Remoto.url();
    document.getElementById('loginErr').textContent=msg||'';
    setTimeout(()=>document.getElementById(CONFIG.apiUrl||Remoto.url()?'loginClave':'loginUrl').focus(),60);
    this._p=new Promise(res=>{ this._res=res; });
    return this._p;
  },
  async enviar(e){
    e.preventDefault();
    const url=document.getElementById('loginUrl').value.trim(), clave=document.getElementById('loginClave').value.trim(), err=document.getElementById('loginErr'), b=document.getElementById('loginBtn');
    if(!CONFIG.apiUrl){ if(!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)){ err.textContent='Pega el enlace de la aplicación web: empieza con https://script.google.com/ y termina en /exec'; return; } try{ localStorage.setItem(Remoto.K_URL,url); }catch(x){} }
    if(!clave){ err.textContent='Escribe tu clave.'; return; }
    try{ localStorage.setItem(Remoto.K_CLAVE,clave); }catch(x){}
    b.disabled=true; b.textContent='Conectando…'; err.textContent='';
    try{
      const r=await Remoto.llamar('leer',{},90000);
      document.getElementById('login').hidden=true; document.getElementById('loginClave').value='';
      const res=this._res; this._p=null; this._res=null; res(r);
    }catch(x){
      if(x.code==='CLAVE'){ try{ localStorage.removeItem(Remoto.K_CLAVE); }catch(y){} }
      err.textContent=x.code==='CLAVE'?'Clave incorrecta.':x.message;
    }finally{ b.disabled=false; b.textContent='Entrar'; }
  },
  salir(){
    if(Sync.cola.length && !confirmarSalida()) return;
    [Remoto.K_CLAVE,Remoto.K_CACHE,Sync.K_COLA,Tes.KEY,Envios.KEY].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    Remoto.borrarCache().finally(()=>location.reload());
  }
};
function confirmarSalida(){ return Sync._confirmSalir ? true : (Sync._confirmSalir=true, toast(`Tienes ${Sync.cola.length} cambio(s) sin guardar en Google. Toca “Cerrar sesión” otra vez para salir igual.`), setTimeout(()=>Sync._confirmSalir=false,5000), false); }

  olvidar(){}
};

/* ---------------- REGISTRAR PAGO ----------------
   Marca en BD Ingresos los pedidos PTE más antiguos que cubre el valor recibido
   (+ saldo a favor que ya tenía). Lo que sobra queda como saldo a favor. */
const Pagar = {
  id:null, c:null,
  abrir(){
    const c=State.M.clientes.get(State.drawer.key); if(!c) return;
    const pend=c.pedidos.filter(v=>v.pendiente);
    if(!pend.length){ toast('Este cliente no tiene pedidos pendientes.'); return; }
    this.c=c; this.id='P'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    const cred=Pagos.totalCliente(c.key), saldo=Calc.saldo(c);
    const ult=[...c.pedidos].reverse().find(v=>!v.pendiente&&v.forma==='TRANSFERENCIA'&&v.banco);
    const uniq=f=>[...new Set(State.M.ventas.map(f).filter(x=>x&&x!=='EFECTIVO'))].sort();
    const bancos=uniq(v=>v.banco), dest=uniq(v=>v.destinatario), banco=ult?ult.banco:(bancos[0]||''), des=ult?ult.destinatario:'';
    ModalImg.tk++; ModalImg.tipo='pago';
    document.getElementById('modalBox').innerHTML=`
      <div class="dr-head"><div style="flex:1;min-width:0;position:relative;z-index:1"><div class="lbl-s">Registrar pago</div><h2 style="font-size:22px">${U.esc(c.nombre)}</h2><div class="muted" style="font-size:12px">${U.esc(c.grupo)} · debe ${U.money(saldo)} (${pend.length} pedido${pend.length>1?'s':''})${cred>0.004?` · saldo a favor ${U.money(cred)}`:''}</div></div><button class="btn ghost" data-action="cerrarModal">${I.x}</button></div>
      <div class="pad" style="overflow:auto">
        <div class="rep-form" style="grid-template-columns:1fr 1fr">
          <div class="field"><label>Valor recibido</label><input type="number" id="pgValor" step="0.01" min="0" inputmode="decimal" value="${saldo.toFixed(2)}"></div>
          <div class="field"><label>Fecha de pago</label><input type="date" id="pgFecha" value="${U.iso(U.hoy())}"></div>
        </div>
        <div class="field"><label>Forma de pago</label><div class="seg" id="pgForma"><button class="on" data-action="pgForma" data-f="TRANSFERENCIA">Transferencia</button><button data-action="pgForma" data-f="EFECTIVO">Efectivo</button></div></div>
        <div class="rep-form" style="grid-template-columns:1fr 1fr" id="pgBancoF">
          <div class="field"><label>Banco</label><input id="pgBanco" list="pgBancos" value="${U.esc(banco)}" autocomplete="off"><datalist id="pgBancos">${bancos.map(b=>`<option value="${U.esc(b)}">`).join('')}</datalist></div>
          <div class="field"><label>Destinatario (quién recibió)</label><input id="pgDest" list="pgDests" value="${U.esc(des)}" autocomplete="off"><datalist id="pgDests">${dest.map(b=>`<option value="${U.esc(b)}">`).join('')}</datalist></div>
        </div>
        <div class="note" style="margin-top:14px" id="pgResumen"></div>
        <div class="rep" id="pgMsg" style="display:none"></div>
      </div>
      <div class="modal-foot"><button class="btn primary" id="pgBtn" data-action="pgGuardar">Registrar pago</button><button class="btn" data-action="cerrarModal">Cancelar</button></div>`;
    document.getElementById('modal').classList.add('on');
    ['pgValor','pgFecha'].forEach(i=>document.getElementById(i).addEventListener('input',()=>this.resumen()));
    this.resumen(); setTimeout(()=>document.getElementById('pgValor')?.select(),50);
  },
  forma(f){ document.querySelectorAll('#pgForma button').forEach(b=>b.classList.toggle('on',b.dataset.f===f)); document.getElementById('pgBanco').closest('.field').style.display=f==='EFECTIVO'?'none':''; this.resumen(); },
  formaSel(){ const b=document.querySelector('#pgForma button.on'); return b?b.dataset.f:'TRANSFERENCIA'; },
  calcular(){
    const c=this.c, monto=U.r2(parseFloat(document.getElementById('pgValor').value)||0), cred=Pagos.totalCliente(c.key);
    const pend=c.pedidos.filter(v=>v.pendiente), disp=U.r2(monto+cred), cub=[]; let acc=0;
    for(const v of pend){ if(acc+v.valor<=disp+0.004){ cub.push(v); acc=U.r2(acc+v.valor); } else break; }
    return {monto,cred,pend,cub,acc,favor:Math.max(0,U.r2(disp-acc)),resta:pend.slice(cub.length)};
  },
  resumen(){
    const R=this.calcular(), el=document.getElementById('pgResumen'); if(!el) return;
    if(!(R.monto>0)){ el.innerHTML='<span class="ic">i</span><span>Escribe el valor que recibiste.</span>'; return; }
    const restaV=U.sum(R.resta,v=>v.valor);
    el.innerHTML=`<span class="ic">✓</span><span>${R.cub.length?`Se marcarán como <b>pagados ${R.cub.length} pedido${R.cub.length>1?'s':''}</b> (del ${U.fdate(R.cub[0].f)} al ${U.fdate(R.cub[R.cub.length-1].f)}) por <b>${U.money(R.acc)}</b> en tu hoja.`:`El valor no alcanza para el pedido más antiguo (${U.money(R.pend[0].valor)}): <b>no se marcará ningún pedido</b>.`}
      ${R.cred>0.004?` Se usa el saldo a favor anterior (${U.money(R.cred)}).`:''}
      ${R.favor>0.004?` Quedará <b>${U.money(R.favor)} a favor</b> del cliente.`:''}
      ${R.resta.length?` Siguen pendientes ${R.resta.length} pedido${R.resta.length>1?'s':''} (${U.money(restaV)}).`:' La cuenta queda al día.'}</span>`;
  },
  msg(html,err){ const m=document.getElementById('pgMsg'); if(!m) return; m.style.display=''; m.innerHTML=`<div class="${err?'err':'ok'}">${html}</div>`; },
  /* Saldo a favor: los abonos vigentes se consumen y queda uno nuevo con lo que sobra */
  actualizarCredito(R,fecha){
    Envios.cargar(); const c=this.c;
    for(const a of Envios.st.abonos){ if(a.key===c.key && Envios.vigente(a)) a.consumido=fecha; }
    if(R.favor>0.004) Envios.st.abonos.push({id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), envioId:null, key:c.key, fecha, valor:R.favor, nota:'Saldo a favor de pago', favor:true, sigs:R.resta.map(v=>v.sig)});
    Envios.guardar(); Envios.aplicar();
  },
  async guardar(){
    const R=this.calcular(), fecha=document.getElementById('pgFecha').value, forma=this.formaSel(), c=this.c;
    const banco=forma==='EFECTIVO'?'':document.getElementById('pgBanco').value.trim().toUpperCase(), dest=document.getElementById('pgDest').value.trim().toUpperCase();
    if(!(R.monto>0)) return this.msg('Escribe el valor recibido.',true);
    if(!fecha) return this.msg('Elige la fecha de pago.',true);
    if(forma==='TRANSFERENCIA'&&!banco) return this.msg('Escribe el banco de la transferencia.',true);
    const btn=document.getElementById('pgBtn'); btn.disabled=true; btn.textContent='Registrando en Google…';
    try{
      if(R.cub.length){
        const pago={id:this.id, fecha, forma, banco, destinatario:dest, cliente:c.nombre, grupo:c.grupo, recibido:R.monto, aplicado:R.acc, favor:R.favor,
          pedidos:R.cub.map(v=>{ const i=v.sig.lastIndexOf('#'); return {base:v.sig.slice(0,i), n:+v.sig.slice(i+1)}; })};
        const r=await Remoto.llamar('pagar',{pago},60000);
        if(!r.marcados){ this.msg(`No se marcó ningún pedido: ${r.yaPagados.length?`${r.yaPagados.length} ya estaban pagados en la hoja`:''}${r.noEncontrados.length?` ${r.noEncontrados.length} no se encontraron (¿se editó la hoja?)`:''}. Pulsa “Actualizar ahora” y revisa.`,true); btn.disabled=false; btn.textContent='Registrar pago'; return; }
        this.actualizarCredito(R,fecha);
        ModalImg.cerrar();
        const aviso=(r.yaPagados.length||r.noEncontrados.length)?` (${r.yaPagados.length+r.noEncontrados.length} ya no estaban en PTE)`:'';
        toast(`✓ Pago registrado: ${r.marcados} pedido${r.marcados>1?'s':''} marcado${r.marcados>1?'s':''} en tu hoja${aviso}${R.favor>0.004?` · ${U.money(R.favor)} a favor`:''}`);
        await Sync.refrescar(true);
      }else{
        this.actualizarCredito(R,fecha); ModalImg.cerrar();
        toast(`Se guardó ${U.money(R.monto)} como saldo a favor de ${c.nombre}.`); UI.render(false); if(Drawer.abierto()) Drawer.render();
      }
    }catch(err){
      const t=err.code==='ACCION'?'Tu Code.gs es una versión anterior: pega el Code.gs nuevo y publica una “Nueva versión”.':
        err.code==='RED'?'Sin conexión con Google: el pago NO se registró. Vuelve a pulsar cuando tengas internet (no se duplicará).':U.esc(err.message);
      this.msg(t,true); btn.disabled=false; btn.textContent='Reintentar';
    }
  }
};

/* ---------------- INICIO ---------------- */
async function iniciarApp(datos){
  State.M=Calc.construirModelo(datos); Contactos.aplicar(State.M, datos.contactos);
  State.sig=new Map(State.M.ventas.map(v=>[v.sig,v]));
  State.mensual=Calc.mensual(State.M);
  Envios.cargar(); Envios.recalc();
  State.K=Calc.kpis(State.M, State.mensual);
  State.periodo={desde:State.M.meses[0], hasta:State.M.meses[State.M.meses.length-1]};
  document.getElementById('pillCobros').textContent=State.K.deudores||'';
  { const p=document.getElementById('pillEnv'); if(p) p.textContent=Envios.pendientes().length||''; }
  State.anchoPrevio=innerWidth;
  UI.bind();
  Nav.aplicar();
  Sync.pintar();
  setTimeout(()=>document.getElementById('splash').classList.add('off'),300);
}

function errorInicio(msg){
  const sp=document.getElementById('splash'); sp.classList.remove('off');
  sp.querySelector('p').innerHTML=`${U.esc(msg)}<br><button class="btn primary" style="margin-top:16px" onclick="location.reload()">Reintentar</button> <button class="btn" style="margin-top:16px" onclick="Login.salir()">Cambiar clave</button>`;
}

(async function init(){
  document.querySelectorAll('img[data-logo]').forEach(i=>{ if(!i.src) i.src=LOGO; });
  Tip.el=document.getElementById('tip');
  Tema.pintarBoton();
  document.getElementById('loginForm').addEventListener('submit',e=>Login.enviar(e));
  Sync.init();
  ImgCfg.cargar();
  let respuesta=null;
  if(!Remoto.url()||!Remoto.clave()) respuesta=await Login.pedir();
  const cache=await Remoto.leerCache();
  try{
    if(respuesta){
      document.getElementById('splash').classList.remove('off');
      const {datos,firma}=Sync.procesarRespuesta(respuesta); Sync.firma=firma; Sync.aplicarTablas(respuesta.tablas);
      await iniciarApp(datos); Sync.flush();
    }else if(cache&&cache.raw){
      // Abre al instante con la copia local y actualiza en segundo plano
      DataSource.meta=cache.raw.meta||{}; DataSource.rep=cache.rep; Sync.usuario=cache.usuario; Sync.leido=cache.leido; Sync.firma=cache.firma;
      Sync.aplicarTablas(cache.tablas);
      await iniciarApp(DataSource.normalizar(cache.raw));
      Sync.flush(); Sync.refrescar(false);
    }else{
      document.querySelector('#splash p').textContent='Conectando con Google Drive… (la primera vez puede tardar unos segundos)';
      let r;
      try{ r=await Remoto.llamar('leer',{},90000); }
      catch(err){ if(err.code==='CLAVE'){ r=await Login.pedir('Clave incorrecta.'); document.getElementById('splash').classList.remove('off'); } else throw err; }
      const {datos,firma}=Sync.procesarRespuesta(r); Sync.firma=firma; Sync.aplicarTablas(r.tablas);
      await iniciarApp(datos); Sync.flush();
    }
  }catch(err){ console.error(err); errorInicio('No se pudo abrir el tablero: '+err.message); }
})();

</script>
